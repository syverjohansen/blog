name: Ski-jumping prediction shadow

on:
  schedule:
    - cron: "17 5,11,17,23 * 1-3,11-12 *"
  workflow_dispatch:
    inputs:
      logical_date:
        description: Race date (YYYY-MM-DD); defaults to today UTC
        required: false
        type: string
      n_simulations:
        description: Deterministic Monte Carlo iteration count
        required: true
        default: 250
        type: number
      random_seed:
        description: Deterministic simulation seed
        required: true
        default: 20260210
        type: number
      ski_ref:
        description: Accepted ski branch, tag, or commit to read
        required: true
        default: main
        type: string
      publish_predictions:
        description: Publish only after the complete shadow and Hugo gates pass
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ski-jumping-prediction-shadow
  cancel-in-progress: false

jobs:
  shadow:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      artifact_name: ${{ steps.parameters.outputs.artifact_name }}
      logical_date: ${{ steps.parameters.outputs.logical_date }}
      run_id: ${{ steps.parameters.outputs.run_id }}
      has_work: ${{ steps.plan.outputs.has_work }}
    steps:
      - name: Check out bounded blog runtime
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/workflows/ski-jumping-prediction-shadow.yml
            /pipelines/__init__.py
            /pipelines/requirements-integration.txt
            /pipelines/skijump_prediction_contract.py
            /pipelines/skijump_prediction_inventory.json
            /pipelines/skijump_prediction_shadow.py
            /content/post/skijump/drafts/race-picks-simulation.R
            /content/post/shared/logging-utils.R
            /content/post/shared/sport_params.R

      - name: Resolve ski source to an exact commit
        id: ski
        env:
          GH_TOKEN: ${{ github.token }}
          SKI_REF: ${{ inputs.ski_ref || 'main' }}
        run: |
          ski_sha=$(gh api "repos/syverjohansen/ski/commits/$SKI_REF" --jq .sha)
          if ! [[ "$ski_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Unable to resolve ski ref: $SKI_REF" >&2
            exit 1
          fi
          echo "sha=$ski_sha" >> "$GITHUB_OUTPUT"

      - name: Check out only declared ski-jumping prediction inputs
        uses: actions/checkout@v4
        with:
          repository: syverjohansen/ski
          ref: ${{ steps.ski.outputs.sha }}
          path: external/ski
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /elo/python/skijump/polars/excel365/races.csv
            /elo/python/skijump/polars/excel365/men_chrono_elevation.csv
            /elo/python/skijump/polars/excel365/ladies_chrono_elevation.csv
            /elo/python/skijump/polars/excel365/fis_identity_aliases.csv
            /elo/python/skijump/polars/relay/excel365/men_team_chrono.csv
            /elo/python/skijump/polars/relay/excel365/ladies_team_chrono.csv
            /elo/python/skijump/polars/relay/excel365/mixed_team_chrono.csv
            /elo/python/skijump/polars/skijump_results_gap.py
            /elo/python/skijump/polars/skijump_results_identity.py
            /elo/python/skijump/polars/skijump_startlist_acquire.py
            /elo/python/skijump/polars/skijump_startlist_normalize.py

      - name: Prepare immutable shadow parameters
        id: parameters
        env:
          LOGICAL_DATE_INPUT: ${{ inputs.logical_date || '' }}
          N_SIMULATIONS_INPUT: ${{ inputs.n_simulations || 250 }}
          RANDOM_SEED_INPUT: ${{ inputs.random_seed || 20260210 }}
          SKI_SHA: ${{ steps.ski.outputs.sha }}
        run: |
          logical_date="${LOGICAL_DATE_INPUT:-$(date -u +%F)}"
          python3 - "$logical_date" "$N_SIMULATIONS_INPUT" "$RANDOM_SEED_INPUT" <<'PY'
          from datetime import date
          import sys

          date.fromisoformat(sys.argv[1])
          if int(sys.argv[2]) < 1:
              raise SystemExit("n_simulations must be positive")
          int(sys.argv[3])
          PY
          blog_sha=$(git rev-parse HEAD)
          if ! [[ "$blog_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Unable to resolve checked-out blog revision" >&2
            exit 1
          fi
          run_id="github-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          shadow_root="$RUNNER_TEMP/ski-jumping-prediction-shadow"
          acquisition_root="$shadow_root/startlists/acquired"
          normalization_root="$shadow_root/startlists/normalized"
          mkdir -p "$shadow_root"
          {
            echo "LOGICAL_DATE=$logical_date"
            echo "N_SIMULATIONS=$N_SIMULATIONS_INPUT"
            echo "RANDOM_SEED=$RANDOM_SEED_INPUT"
            echo "BLOG_SHA=$blog_sha"
            echo "SKI_SHA=$SKI_SHA"
            echo "RUN_ID=$run_id"
            echo "SHADOW_ROOT=$shadow_root"
            echo "STARTLIST_ACQUISITION_ROOT=$acquisition_root"
            echo "STARTLIST_NORMALIZATION_ROOT=$normalization_root"
            echo "STARTLIST_CANDIDATE_ROOT=$normalization_root/candidates"
            echo "STARTLIST_NORMALIZATION_REPORT=$normalization_root/report.json"
            echo "REPORT_PATH=$shadow_root/runs/$run_id/reports/shadow-report.json"
          } >> "$GITHUB_ENV"
          echo "artifact_name=ski-jumping-prediction-shadow-${logical_date}-${GITHUB_RUN_ID}" \
            >> "$GITHUB_OUTPUT"
          echo "logical_date=$logical_date" >> "$GITHUB_OUTPUT"
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"

      - name: Build publication-disabled execution plan
        id: plan
        run: |
          python3 -m pipelines.skijump_prediction_contract \
            --schedule external/ski/elo/python/skijump/polars/excel365/races.csv \
            --logical-date "$LOGICAL_DATE" \
            --output "$SHADOW_ROOT/preflight-plan.json"
          status=$(python3 -c \
            'import json,sys; print(json.load(open(sys.argv[1]))["status"])' \
            "$SHADOW_ROOT/preflight-plan.json")
          if [[ "$status" == "ready_for_shadow_implementation" ]]; then
            echo "has_work=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_work=false" >> "$GITHUB_OUTPUT"
          fi
          echo "status=$status" >> "$GITHUB_OUTPUT"

      - name: Set up Python validation runtime
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipelines/requirements-integration.txt

      - name: Install workbook validation dependencies
        run: python3 -m pip install -r pipelines/requirements-integration.txt

      - name: Acquire exact-date official FIS startlists
        if: steps.plan.outputs.has_work == 'true'
        run: |
          python3 external/ski/elo/python/skijump/polars/skijump_startlist_acquire.py \
            --schedule external/ski/elo/python/skijump/polars/excel365/races.csv \
            --logical-date "$LOGICAL_DATE" \
            --output-dir "$STARTLIST_ACQUISITION_ROOT" \
            --allow-network \
            --fail-if-waiting

      - name: Normalize official startlists for the model
        if: steps.plan.outputs.has_work == 'true'
        run: |
          python3 external/ski/elo/python/skijump/polars/skijump_startlist_normalize.py \
            --acquired-startlists "$STARTLIST_ACQUISITION_ROOT/startlists.csv" \
            --acquisition-report "$STARTLIST_ACQUISITION_ROOT/report.json" \
            --men-history external/ski/elo/python/skijump/polars/excel365/men_chrono_elevation.csv \
            --ladies-history external/ski/elo/python/skijump/polars/excel365/ladies_chrono_elevation.csv \
            --aliases external/ski/elo/python/skijump/polars/excel365/fis_identity_aliases.csv \
            --logical-date "$LOGICAL_DATE" \
            --output-dir "$STARTLIST_NORMALIZATION_ROOT" \
            --fail-on-unresolved

      - name: Set up R
        if: steps.plan.outputs.has_work == 'true'
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install R simulation dependencies
        if: steps.plan.outputs.has_work == 'true'
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::dplyr
            any::tidyr
            any::openxlsx
            any::mgcv
            any::leaps
            any::logger
            any::lubridate

      - name: Run publication-disabled prediction shadow
        id: run_shadow
        continue-on-error: true
        run: |
          python3 -m pipelines.skijump_prediction_shadow \
            --blog-root "$GITHUB_WORKSPACE" \
            --ski-root "$GITHUB_WORKSPACE/external/ski" \
            --output-root "$SHADOW_ROOT" \
            --logical-date "$LOGICAL_DATE" \
            --run-id "$RUN_ID" \
            --n-simulations "$N_SIMULATIONS" \
            --random-seed "$RANDOM_SEED" \
            --blog-commit "$BLOG_SHA" \
            --ski-commit "$SKI_SHA" \
            --startlist-root "$STARTLIST_CANDIDATE_ROOT" \
            --startlist-report "$STARTLIST_NORMALIZATION_REPORT"

      - name: Upload complete shadow evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.parameters.outputs.artifact_name }}
          path: ${{ runner.temp }}/ski-jumping-prediction-shadow/
          if-no-files-found: error
          retention-days: 30

      - name: Enforce retained publication-disabled result
        if: always()
        env:
          RUNNER_OUTCOME: ${{ steps.run_shadow.outcome }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          report_path = Path(os.environ["REPORT_PATH"])
          if not report_path.is_file():
              raise SystemExit(f"shadow report is missing: {report_path}")
          report = json.loads(report_path.read_text(encoding="utf-8"))
          if report.get("publication") != {
              "reason": "shadow runs retain evidence and cannot create or publish posts",
              "status": "disabled",
          }:
              raise SystemExit("shadow publication lock was not retained")
          if os.environ["RUNNER_OUTCOME"] != "success":
              raise SystemExit(f"shadow runner failed: {report.get('error')}")
          if report.get("status") not in {"passed", "skipped"}:
              raise SystemExit(f"unexpected shadow status: {report.get('status')}")
          print(f"Ski-jumping prediction shadow status={report['status']}")
          PY

  publish:
    name: Publish validated ski-jumping predictions
    needs: shadow
    if: >-
      needs.shadow.result == 'success' &&
      needs.shadow.outputs.has_work == 'true' &&
      (github.event_name == 'schedule' || inputs.publish_predictions == true)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Check out publication base
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Download exact passed shadow evidence
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.shadow.outputs.artifact_name }}
          path: ${{ runner.temp }}/ski-jumping-shadow-artifact

      - name: Set up Python publication runtime
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipelines/requirements-integration.txt

      - name: Install publication dependencies
        run: python3 -m pip install -r pipelines/requirements-integration.txt

      - name: Materialize parity-checked publication candidate
        id: candidate
        env:
          LOGICAL_DATE: ${{ needs.shadow.outputs.logical_date }}
          RUN_ID: ${{ needs.shadow.outputs.run_id }}
        run: |
          artifact_root="$RUNNER_TEMP/ski-jumping-shadow-artifact"
          run_root="$artifact_root/runs/$RUN_ID"
          date_key="${LOGICAL_DATE//-/}"
          report="$RUNNER_TEMP/ski-jumping-publication-report.json"
          python3 -m pipelines.skijump_prediction_publication \
            --shadow-report "$run_root/reports/shadow-report.json" \
            --normalization-report "$artifact_root/startlists/normalized/report.json" \
            --workbook-root "$run_root/workbooks/$date_key" \
            --repository-root "$GITHUB_WORKSPACE" \
            --report "$report"
          if [[ -z "$(git status --porcelain -- \
            "data/skijump/drafts/race-picks/$date_key" \
            "content/post/race-picks/ski-jumping-$date_key.md")" ]]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
          echo "date_key=$date_key" >> "$GITHUB_OUTPUT"

      - name: Set up Hugo
        if: steps.candidate.outputs.changed == 'true'
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.134.1"
          extended: true

      - name: Render complete site candidate
        if: steps.candidate.outputs.changed == 'true'
        run: hugo --minify --destination "$RUNNER_TEMP/ski-jumping-publication-site"

      - name: Publish validated ski-jumping predictions
        if: steps.candidate.outputs.changed == 'true'
        env:
          DATE_KEY: ${{ steps.candidate.outputs.date_key }}
          LOGICAL_DATE: ${{ needs.shadow.outputs.logical_date }}
          RUN_ID: ${{ needs.shadow.outputs.run_id }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            "data/skijump/drafts/race-picks/$DATE_KEY" \
            "content/post/race-picks/ski-jumping-$DATE_KEY.md"
          git commit -m "Publish ski-jumping race picks for $LOGICAL_DATE" \
            -m "Validated shadow run: $RUN_ID"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Retain publication and parity report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ski-jumping-publication-${{ needs.shadow.outputs.logical_date }}-${{ github.run_id }}
          path: ${{ runner.temp }}/ski-jumping-publication-report.json
          if-no-files-found: warn
          retention-days: 30
