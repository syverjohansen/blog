name: Cross-country automatic daily pipeline

on:
  workflow_run:
    workflows: ["Alpine Production Shadow"]
    types: [completed]
  workflow_dispatch:
    inputs:
      as_of:
        description: Results cutoff (YYYY-MM-DD); defaults to yesterday UTC
        required: false
        type: string
      schedule_season:
        description: Optional schedule season; defaults to accepted season or next season from October 1
        required: false
        type: string
      ski_ref:
        description: Ski ref to start from
        required: true
        default: main
        type: string
      run_season_close:
        description: Attempt the guarded season close (still rejects dates before May 1)
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: cross-country-automatic-daily-pipeline
  cancel-in-progress: false

jobs:
  update:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Resolve exact source revisions
        id: source
        env:
          GH_TOKEN: ${{ secrets.BLOG_AUTOMATION_TOKEN }}
          SKI_REF: ${{ inputs.ski_ref || 'main' }}
        run: |
          ski_sha=$(gh api "repos/syverjohansen/ski/commits/$SKI_REF" --jq .sha)
          blog_sha=$(gh api "repos/syverjohansen/blog/commits/main" --jq .sha)
          if ! [[ "$ski_sha" =~ ^[0-9a-f]{40}$ && "$blog_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Unable to resolve exact source revisions" >&2
            exit 1
          fi
          echo "ski_sha=$ski_sha" >> "$GITHUB_OUTPUT"
          echo "blog_sha=$blog_sha" >> "$GITHUB_OUTPUT"

      - name: Check out cross-country pipeline and accepted data
        uses: actions/checkout@v4
        with:
          repository: syverjohansen/ski
          ref: ${{ steps.source.outputs.ski_sha }}
          token: ${{ secrets.BLOG_AUTOMATION_TOKEN }}
          path: external/ski
          fetch-depth: 1
          persist-credentials: true
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /elo/python/pipeline_config.py
            /elo/python/standings_contract.py
            /elo/python/ski/polars/
            /ranks/ski/excel365/men_scrape_update.csv
            /ranks/ski/excel365/ladies_scrape_update.csv

      - name: Set up Python runtime
        uses: astral-sh/setup-uv@v6

      - name: Resolve run parameters
        id: parameters
        env:
          REQUESTED_AS_OF: ${{ inputs.as_of || '' }}
          REQUESTED_SCHEDULE_SEASON: ${{ inputs.schedule_season || '' }}
        run: |
          as_of="${REQUESTED_AS_OF:-$(date -u -d 'yesterday' +%F)}"
          if ! [[ "$as_of" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
            echo "Invalid as_of date: $as_of" >&2
            exit 1
          fi
          season="$REQUESTED_SCHEDULE_SEASON"
          if [[ -n "$season" ]] && ! [[ "$season" =~ ^[0-9]{4}$ ]]; then
            echo "Invalid season: $season" >&2
            exit 1
          fi
          echo "as_of=$as_of" >> "$GITHUB_OUTPUT"
          echo "run_date=$(date -u +%F)" >> "$GITHUB_OUTPUT"
          echo "requested_schedule_season=$season" >> "$GITHUB_OUTPUT"
          echo "schedule_root=$RUNNER_TEMP/cross-country-schedule-update" >> "$GITHUB_OUTPUT"
          echo "results_root=$RUNNER_TEMP/cross-country-results-update" >> "$GITHUB_OUTPUT"
          echo "team_results_root=$RUNNER_TEMP/cross-country-team-results-update" >> "$GITHUB_OUTPUT"
          echo "season_close_root=$RUNNER_TEMP/cross-country-season-close" >> "$GITHUB_OUTPUT"

      - name: Resolve schedule acquisition season
        id: schedule_season
        working-directory: external/ski/elo/python/ski/polars
        env:
          RUN_DATE: ${{ steps.parameters.outputs.run_date }}
          REQUESTED_SEASON: ${{ steps.parameters.outputs.requested_schedule_season }}
        run: |
          accepted_season=$(python3 - <<'PY'
          from pathlib import Path

          from schedule_contract import RACES_COLUMNS, infer_fis_season, read_csv

          races = read_csv(Path("excel365/races.csv"), RACES_COLUMNS)
          print(infer_fis_season(races))
          PY
          )
          rollover_date="$accepted_season-10-01"
          season="$REQUESTED_SEASON"
          if [[ -z "$season" ]]; then
            season="$accepted_season"
            if [[ "$RUN_DATE" > "$rollover_date" || "$RUN_DATE" == "$rollover_date" ]]; then
              season=$((accepted_season + 1))
            fi
          fi
          rollover_allowed=false
          if [[ "$season" == "$accepted_season" ]]; then
            :
          elif [[ "$season" == "$((accepted_season + 1))" && ( "$RUN_DATE" > "$rollover_date" || "$RUN_DATE" == "$rollover_date" ) ]]; then
            rollover_allowed=true
          else
            echo "Unsupported schedule transition: accepted=$accepted_season requested=$season run_date=$RUN_DATE" >&2
            exit 1
          fi
          echo "accepted_season=$accepted_season" >> "$GITHUB_OUTPUT"
          echo "season=$season" >> "$GITHUB_OUTPUT"
          echo "rollover_allowed=$rollover_allowed" >> "$GITHUB_OUTPUT"

      - name: Build isolated schedule candidate
        working-directory: external/ski/elo/python/ski/polars
        run: >-
          uv run --with requests --with beautifulsoup4
          python scrape_schedule_shadow.py
          --season "${{ steps.schedule_season.outputs.season }}"
          --accepted-races excel365/races.csv
          --elevation-file excel365/elevation.csv
          --output-root "${{ steps.parameters.outputs.schedule_root }}"

      - name: Stage validated schedule
        id: schedule_candidate
        env:
          ACCEPTED_SEASON: ${{ steps.schedule_season.outputs.accepted_season }}
          ACQUISITION_SEASON: ${{ steps.schedule_season.outputs.season }}
          ROLLOVER_ALLOWED: ${{ steps.schedule_season.outputs.rollover_allowed }}
        run: |
          report="${{ steps.parameters.outputs.schedule_root }}/reports/acquisition.json"
          readarray -t schedule_status < <(python3 - "$report" <<'PY'
          import json
          import sys

          report = json.load(open(sys.argv[1], encoding="utf-8"))
          promotion = report["promotion"]["status"]
          comparison = report["comparison"]
          changed = any(comparison[name] for name in ("added", "removed", "changed"))
          print(promotion)
          print(str(changed).lower())
          PY
          )
          promotion="${schedule_status[0]}"
          changed="${schedule_status[1]}"
          root="external/ski/elo/python/ski/polars"
          if [[ "$promotion" == "eligible" ]]; then
            if [[ "$ACQUISITION_SEASON" != "$ACCEPTED_SEASON" ]]; then
              echo "Next-season candidate unexpectedly bypassed rollover validation." >&2
              exit 1
            fi
            if [[ "$changed" == "true" ]]; then
              cp "${{ steps.parameters.outputs.schedule_root }}/candidate/races.csv" "$root/excel365/races.csv"
              cp "${{ steps.parameters.outputs.schedule_root }}/candidate/weekends.csv" "$root/excel365/weekends.csv"
            fi
          elif [[ "$promotion" == "approval_required" && "$ROLLOVER_ALLOWED" == "true" ]]; then
            shadow_report="${{ steps.parameters.outputs.schedule_root }}/reports/schedule-shadow.json"
            report_sha=$(sha256sum "$shadow_report" | cut -d ' ' -f 1)
            python3 "$root/promote_schedule.py" \
              --shadow-report "$shadow_report" \
              --expected-report-sha256 "$report_sha" \
              --accepted-dir "$root/excel365" \
              --approve-season "$ACQUISITION_SEASON" \
              --receipt "${{ steps.parameters.outputs.schedule_root }}/reports/promotion.json"
            changed=true
          else
            echo "Schedule candidate is $promotion; retaining the accepted schedule." >&2
            exit 1
          fi
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
          cat "$report" >> "$GITHUB_STEP_SUMMARY"

      - name: Build isolated results candidate
        working-directory: external/ski/elo/python/ski/polars
        run: |
          python3 cross_country_results_update.py \
            --schedule excel365/races.csv \
            --men-chrono excel365/men_chrono.csv \
            --ladies-chrono excel365/ladies_chrono.csv \
            --aliases excel365/fis_identity_aliases.csv \
            --as-of "${{ steps.parameters.outputs.as_of }}" \
            --output-root "${{ steps.parameters.outputs.results_root }}" \
            --allow-network

      - name: Read and stage results candidate
        id: results_candidate
        run: |
          report="${{ steps.parameters.outputs.results_root }}/report.json"
          status=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["status"])' "$report")
          if [[ "$status" == "candidate" ]]; then
            root="external/ski/elo/python/ski/polars/excel365"
            cp "${{ steps.parameters.outputs.results_root }}/promotion/men_chrono.csv" "$root/men_chrono.csv"
            cp "${{ steps.parameters.outputs.results_root }}/promotion/ladies_chrono.csv" "$root/ladies_chrono.csv"
          elif [[ "$status" != "no_changes" ]]; then
            echo "Unexpected results status: $status" >&2
            exit 1
          fi
          echo "status=$status" >> "$GITHUB_OUTPUT"
          cat "$report" >> "$GITHUB_STEP_SUMMARY"

      - name: Build isolated team-results candidate
        working-directory: external/ski/elo/python/ski/polars
        run: |
          python3 cross_country_team_results_update.py \
            --schedule excel365/races.csv \
            --men-chrono excel365/men_chrono.csv \
            --ladies-chrono excel365/ladies_chrono.csv \
            --men-relay-chrono relay/excel365/men_relay_chrono.csv \
            --ladies-relay-chrono relay/excel365/ladies_relay_chrono.csv \
            --team-sprint-chrono relay/excel365/team_sprint_chrono.csv \
            --aliases excel365/fis_identity_aliases.csv \
            --as-of "${{ steps.parameters.outputs.as_of }}" \
            --output-root "${{ steps.parameters.outputs.team_results_root }}" \
            --allow-network

      - name: Read and stage team-results candidate
        id: team_results_candidate
        run: |
          report="${{ steps.parameters.outputs.team_results_root }}/report.json"
          status=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["status"])' "$report")
          if [[ "$status" == "candidate" ]]; then
            root="external/ski/elo/python/ski/polars"
            cp "${{ steps.parameters.outputs.team_results_root }}/promotion/men_chrono.csv" \
              "$root/excel365/men_chrono.csv"
            cp "${{ steps.parameters.outputs.team_results_root }}/promotion/ladies_chrono.csv" \
              "$root/excel365/ladies_chrono.csv"
            cp "${{ steps.parameters.outputs.team_results_root }}/promotion/men_relay_chrono.csv" \
              "$root/relay/excel365/men_relay_chrono.csv"
            cp "${{ steps.parameters.outputs.team_results_root }}/promotion/ladies_relay_chrono.csv" \
              "$root/relay/excel365/ladies_relay_chrono.csv"
            cp "${{ steps.parameters.outputs.team_results_root }}/promotion/team_sprint_chrono.csv" \
              "$root/relay/excel365/team_sprint_chrono.csv"
          elif [[ "$status" != "no_changes" ]]; then
            echo "Unexpected team-results status: $status" >&2
            exit 1
          fi
          echo "status=$status" >> "$GITHUB_OUTPUT"
          cat "$report" >> "$GITHUB_STEP_SUMMARY"

      - name: Build and stage guarded season close
        id: season_close
        env:
          AS_OF: ${{ steps.parameters.outputs.as_of }}
          FORCE_CLOSE: ${{ inputs.run_season_close || false }}
          RUN_DATE: ${{ steps.parameters.outputs.run_date }}
          SEASON: ${{ steps.schedule_season.outputs.season }}
        run: |
          close_date="$SEASON-05-01"
          close_as_of="$AS_OF"
          if [[ "$RUN_DATE" == "$close_date" ]]; then
            close_as_of="$RUN_DATE"
          fi
          if [[ "$close_as_of" < "$close_date" && "$FORCE_CLOSE" != "true" ]]; then
            echo "status=skipped" >> "$GITHUB_OUTPUT"
            echo "finalized=false" >> "$GITHUB_OUTPUT"
            echo "Season $SEASON does not close before $close_date." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          root="external/ski/elo/python/ski/polars"
          python3 "$root/cross_country_season_close.py" \
            --schedule "$root/excel365/races.csv" \
            --men-chrono "$root/excel365/men_chrono.csv" \
            --ladies-chrono "$root/excel365/ladies_chrono.csv" \
            --men-relay-chrono "$root/relay/excel365/men_relay_chrono.csv" \
            --ladies-relay-chrono "$root/relay/excel365/ladies_relay_chrono.csv" \
            --team-sprint-chrono "$root/relay/excel365/team_sprint_chrono.csv" \
            --season "$SEASON" \
            --as-of "$close_as_of" \
            --output-root "${{ steps.parameters.outputs.season_close_root }}"
          report="${{ steps.parameters.outputs.season_close_root }}/report.json"
          status=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["status"])' "$report")
          if [[ "$status" == "candidate" ]]; then
            cp "${{ steps.parameters.outputs.season_close_root }}/candidate/men_chrono.csv" "$root/excel365/men_chrono.csv"
            cp "${{ steps.parameters.outputs.season_close_root }}/candidate/ladies_chrono.csv" "$root/excel365/ladies_chrono.csv"
          elif [[ "$status" != "no_changes" ]]; then
            echo "Unexpected season-close status: $status" >&2
            exit 1
          fi
          echo "status=$status" >> "$GITHUB_OUTPUT"
          echo "finalized=true" >> "$GITHUB_OUTPUT"
          cat "$report" >> "$GITHUB_STEP_SUMMARY"

      - name: Snapshot finalized official cross-country standings
        id: standings
        if: steps.season_close.outputs.finalized == 'true'
        env:
          SEASON: ${{ steps.schedule_season.outputs.season }}
        run: |
          root="external/ski/elo/python/ski/polars"
          destination="$root/excel365/ranking_standings/$SEASON"
          uv run --isolated --python 3.12 \
            --with requests --with beautifulsoup4 \
            python3 "$root/standings_scrape.py" \
            --season "$SEASON" \
            --output-dir "$destination"
          if git -C external/ski status --short -- \
            "elo/python/ski/polars/excel365/ranking_standings/$SEASON" | grep -q .; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate and publish accepted ski data
        id: publish_ski
        env:
          AS_OF: ${{ steps.parameters.outputs.as_of }}
          RESULTS_STATUS: ${{ steps.results_candidate.outputs.status }}
          TEAM_RESULTS_STATUS: ${{ steps.team_results_candidate.outputs.status }}
          RUN_DATE: ${{ steps.parameters.outputs.run_date }}
          SCHEDULE_CHANGED: ${{ steps.schedule_candidate.outputs.changed }}
          SEASON_CLOSE_STATUS: ${{ steps.season_close.outputs.status }}
          STANDINGS_CHANGED: ${{ steps.standings.outputs.changed || 'false' }}
        run: |
          root="external/ski/elo/python/ski/polars"
          if [[ "$SCHEDULE_CHANGED" == "true" || "$RESULTS_STATUS" == "candidate" || "$TEAM_RESULTS_STATUS" == "candidate" || "$SEASON_CLOSE_STATUS" == "candidate" || "$STANDINGS_CHANGED" == "true" ]]; then
            python3 -m unittest discover -s "$root" -p 'test_cross_country_results_*.py'
            python3 -m unittest discover -s "$root" -p 'test_cross_country_team_*.py'
            python3 -m unittest discover -s "$root" -p 'test_*schedule*.py'
            python3 -m unittest discover -s "$root" -p 'test_cross_country_season_close.py'
            git -C external/ski config user.name "github-actions[bot]"
            git -C external/ski config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git -C external/ski add \
              elo/python/ski/polars/excel365/races.csv \
              elo/python/ski/polars/excel365/weekends.csv \
              elo/python/ski/polars/excel365/men_chrono.csv \
              elo/python/ski/polars/excel365/ladies_chrono.csv \
              elo/python/ski/polars/relay/excel365/men_relay_chrono.csv \
              elo/python/ski/polars/relay/excel365/ladies_relay_chrono.csv \
              elo/python/ski/polars/relay/excel365/team_sprint_chrono.csv
            if [[ -d "$root/excel365/ranking_standings" ]]; then
              git -C external/ski add elo/python/ski/polars/excel365/ranking_standings
            fi
            if ! git -C external/ski diff --cached --quiet; then
              through="$AS_OF"
              if [[ "$SEASON_CLOSE_STATUS" == "candidate" ]]; then
                through="$RUN_DATE"
              fi
              git -C external/ski commit -m "Update cross-country data through $through"
              git -C external/ski pull --rebase origin main
              git -C external/ski push origin HEAD:main
            fi
          fi
          echo "sha=$(git -C external/ski rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Check out blog for site publication
        if: >-
          steps.results_candidate.outputs.status == 'candidate' ||
          steps.team_results_candidate.outputs.status == 'candidate' ||
          steps.season_close.outputs.status == 'candidate' ||
          steps.standings.outputs.changed == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.source.outputs.blog_sha }}
          path: blog
          fetch-depth: 1

      - name: Generate cross-country site artifacts
        if: >-
          steps.results_candidate.outputs.status == 'candidate' ||
          steps.team_results_candidate.outputs.status == 'candidate' ||
          steps.season_close.outputs.status == 'candidate' ||
          steps.standings.outputs.changed == 'true'
        working-directory: blog
        env:
          SEASON: ${{ steps.schedule_season.outputs.season }}
        run: |
          python3 -m pipelines.cross_country_site_data \
            --men-history ../external/ski/elo/python/ski/polars/excel365/men_chrono.csv \
            --ladies-history ../external/ski/elo/python/ski/polars/excel365/ladies_chrono.csv \
            --men-ranking-history ../external/ski/ranks/ski/excel365/men_scrape_update.csv \
            --ladies-ranking-history ../external/ski/ranks/ski/excel365/ladies_scrape_update.csv \
            --men-relay-history ../external/ski/elo/python/ski/polars/relay/excel365/men_relay_chrono.csv \
            --ladies-relay-history ../external/ski/elo/python/ski/polars/relay/excel365/ladies_relay_chrono.csv \
            --team-sprint-history ../external/ski/elo/python/ski/polars/relay/excel365/team_sprint_chrono.csv \
            --finalized-standings-root ../external/ski/elo/python/ski/polars/excel365/ranking_standings \
            --season "$SEASON" \
            --as-of "${{ steps.parameters.outputs.run_date }}" \
            --output-root static/python/cross-country/excel365

      - name: Run complete blog test suite
        if: >-
          steps.results_candidate.outputs.status == 'candidate' ||
          steps.team_results_candidate.outputs.status == 'candidate' ||
          steps.season_close.outputs.status == 'candidate' ||
          steps.standings.outputs.changed == 'true'
        working-directory: blog
        run: uv run --with polars python -m unittest discover -s tests -p 'test_*.py'

      - name: Set up Hugo
        if: >-
          steps.results_candidate.outputs.status == 'candidate' ||
          steps.team_results_candidate.outputs.status == 'candidate' ||
          steps.season_close.outputs.status == 'candidate' ||
          steps.standings.outputs.changed == 'true'
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.134.1"
          extended: true

      - name: Render site candidate
        if: >-
          steps.results_candidate.outputs.status == 'candidate' ||
          steps.team_results_candidate.outputs.status == 'candidate' ||
          steps.season_close.outputs.status == 'candidate' ||
          steps.standings.outputs.changed == 'true'
        working-directory: blog
        run: hugo --minify --destination "$RUNNER_TEMP/cross-country-site"

      - name: Publish validated site artifacts
        if: >-
          steps.results_candidate.outputs.status == 'candidate' ||
          steps.team_results_candidate.outputs.status == 'candidate' ||
          steps.season_close.outputs.status == 'candidate' ||
          steps.standings.outputs.changed == 'true'
        working-directory: blog
        env:
          AS_OF: ${{ steps.parameters.outputs.as_of }}
          RUN_DATE: ${{ steps.parameters.outputs.run_date }}
          SEASON_CLOSE_STATUS: ${{ steps.season_close.outputs.status }}
          SKI_SHA: ${{ steps.publish_ski.outputs.sha }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add static/python/cross-country/excel365
          if ! git diff --cached --quiet; then
            through="$AS_OF"
            if [[ "$SEASON_CLOSE_STATUS" == "candidate" ]]; then
              through="$RUN_DATE"
            fi
            git commit -m "Publish cross-country site data through $through" \
              -m "Ski source: $SKI_SHA"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Upload update evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cross-country-daily-pipeline-${{ steps.parameters.outputs.as_of }}-${{ github.run_id }}
          path: |
            ${{ steps.parameters.outputs.schedule_root }}/reports/
            ${{ steps.parameters.outputs.schedule_root }}/candidate/
            ${{ steps.parameters.outputs.results_root }}/report.json
            ${{ steps.parameters.outputs.results_root }}/gap-report.json
            ${{ steps.parameters.outputs.results_root }}/acquisition/report.json
            ${{ steps.parameters.outputs.results_root }}/identity/report.json
            ${{ steps.parameters.outputs.results_root }}/replay/report.json
            ${{ steps.parameters.outputs.results_root }}/promotion/report.json
            ${{ steps.parameters.outputs.team_results_root }}/report.json
            ${{ steps.parameters.outputs.team_results_root }}/gap-report.json
            ${{ steps.parameters.outputs.team_results_root }}/acquisition/report.json
            ${{ steps.parameters.outputs.team_results_root }}/identity/report.json
            ${{ steps.parameters.outputs.team_results_root }}/replay/report.json
            ${{ steps.parameters.outputs.team_results_root }}/promotion/report.json
            ${{ steps.parameters.outputs.season_close_root }}/report.json
            ${{ steps.parameters.outputs.season_close_root }}/candidate/men_chrono.csv
            ${{ steps.parameters.outputs.season_close_root }}/candidate/ladies_chrono.csv
          if-no-files-found: warn
          retention-days: 30
