name: Cross-country Final Climb predictions

on:
  workflow_dispatch:
    inputs:
      as_of_date:
        description: Day before or race date (YYYY-MM-DD); defaults to current UTC date
        required: false
        type: string
      n_simulations:
        description: Deterministic Monte Carlo iteration count
        required: true
        default: 250
        type: number
      random_seed:
        description: Deterministic simulation seed
        required: true
        default: 20270110
        type: number
      historical_results_replay:
        description: Replay a completed Final Climb from classified FIS results
        required: true
        default: false
        type: boolean
      ski_ref:
        description: Ski branch, tag, or commit to resolve and record
        required: true
        default: main
        type: string

permissions:
  contents: write

concurrency:
  group: cross-country-final-climb-shadow
  cancel-in-progress: false

jobs:
  shadow:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out bounded blog runtime
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.BLOG_AUTOMATION_TOKEN }}
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/workflows/cross-country-final-climb-shadow.yml
            /pipelines/__init__.py
            /pipelines/cross_country_tour_shadow.py
            /pipelines/cross_country_final_climb_shadow.py
            /pipelines/cross_country_final_climb_publication.py
            /pipelines/requirements-integration.txt
            /pipelines/requirements-snapshot.txt
            /content/post/cross-country/drafts/final_climb-simulation.R
            /content/post/final-climb-picks/
            /data/cross-country/drafts/final-climb-picks/
            /layouts/
            /themes/white/

      - name: Resolve ski source to an exact commit
        id: ski
        env:
          GH_TOKEN: ${{ github.token }}
          SKI_REF: ${{ inputs.ski_ref || 'main' }}
        run: |
          ski_sha=$(gh api "repos/syverjohansen/ski/commits/$SKI_REF" --jq .sha)
          if [[ ! "$ski_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Unable to resolve ski ref: $SKI_REF" >&2
            exit 1
          fi
          echo "sha=$ski_sha" >> "$GITHUB_OUTPUT"

      - name: Check out bounded ski runtime
        uses: actions/checkout@v4
        with:
          repository: syverjohansen/ski
          ref: ${{ steps.ski.outputs.sha }}
          path: external/ski
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /elo/python/ski/polars/cross_country_final_climb_inputs.py
            /elo/python/ski/polars/cross_country_final_climb_contract.py
            /elo/python/ski/polars/cross_country_tour_inputs.py
            /elo/python/ski/polars/cross_country_tour_contract.py
            /elo/python/ski/polars/cross_country_weekend_inputs.py
            /elo/python/ski/polars/cross_country_announced_rosters.py
            /elo/python/ski/polars/cross_country_world_cup_quotas.py
            /elo/python/ski/polars/cross_country_results_identity.py
            /elo/python/ski/polars/schedule_contract.py
            /elo/python/ski/polars/excel365/weekends.csv
            /elo/python/ski/polars/excel365/test_weekends.csv
            /elo/python/ski/polars/excel365/men_chrono_elevation.csv
            /elo/python/ski/polars/excel365/ladies_chrono_elevation.csv
            /elo/python/ski/polars/excel365/fis_identity_aliases.csv

      - name: Prepare immutable shadow parameters
        env:
          AS_OF_DATE_INPUT: ${{ inputs.as_of_date || '' }}
          N_SIMULATIONS_INPUT: ${{ inputs.n_simulations || 250 }}
          RANDOM_SEED_INPUT: ${{ inputs.random_seed || 20270110 }}
          HISTORICAL_REPLAY_INPUT: ${{ inputs.historical_results_replay && 'true' || 'false' }}
          SKI_SHA: ${{ steps.ski.outputs.sha }}
        run: |
          as_of="${AS_OF_DATE_INPUT:-$(date -u +%F)}"
          python3 - "$as_of" "$N_SIMULATIONS_INPUT" "$RANDOM_SEED_INPUT" <<'PY'
          from datetime import date
          import sys

          date.fromisoformat(sys.argv[1])
          if int(sys.argv[2]) < 1:
              raise SystemExit("n_simulations must be positive")
          int(sys.argv[3])
          PY
          root="$RUNNER_TEMP/cross-country-final-climb-shadow"
          mkdir -p "$root/reports"
          if [[ "$HISTORICAL_REPLAY_INPUT" == "true" ]]; then
            schedule_path="external/ski/elo/python/ski/polars/excel365/test_weekends.csv"
            participant_source_mode="historical_results_replay"
          else
            schedule_path="external/ski/elo/python/ski/polars/excel365/weekends.csv"
            participant_source_mode="official_startlist"
          fi
          export PARTICIPANT_SOURCE_MODE="$participant_source_mode"
          blog_sha=$(git rev-parse HEAD)
          if ! [[ "$blog_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Unable to resolve checked-out blog revision" >&2
            exit 1
          fi
          export BLOG_SHA="$blog_sha"
          python3 external/ski/elo/python/ski/polars/cross_country_final_climb_contract.py \
            --schedule "$schedule_path" \
            --logical-date "$as_of" \
            --report "$root/reports/plan.json"
          logical_date=$(python3 - "$root/reports/plan.json" <<'PY'
          import json
          import sys
          from pathlib import Path

          plan = json.loads(Path(sys.argv[1]).read_text())
          target = plan.get("final_climb_date")
          if not target:
              raise SystemExit("accepted schedule has no Final Climb target")
          print(target)
          PY
          )
          {
            echo "AS_OF_DATE=$as_of"
            echo "LOGICAL_DATE=$logical_date"
            echo "N_SIMULATIONS=$N_SIMULATIONS_INPUT"
            echo "RANDOM_SEED=$RANDOM_SEED_INPUT"
            echo "HISTORICAL_RESULTS_REPLAY=$HISTORICAL_REPLAY_INPUT"
            echo "PARTICIPANT_SOURCE_MODE=$participant_source_mode"
            echo "SCHEDULE_PATH=$schedule_path"
            echo "SHADOW_ROOT=$root"
            echo "BUNDLE_ROOT=$root/bundle"
            echo "PREDICTION_ROOT=$root/predictions"
            echo "LOG_ROOT=$root/logs"
            echo "VALIDATION_REPORT=$root/reports/validation_report.json"
            echo "CANDIDATE_ROOT=$root/candidate"
            echo "SITE_ROOT=$root/site"
            echo "RENDER_REPORT=$root/reports/render_report.json"
          } >> "$GITHUB_ENV"
          python3 - "$root/run_metadata.json" "$logical_date" "$as_of" <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          document = {
              "schema_version": "nordicnumbers.cross-country-final-climb-run/v1",
              "logical_date": sys.argv[2],
              "as_of_date": sys.argv[3],
              "blog_commit": os.environ["BLOG_SHA"],
              "ski_commit": os.environ["SKI_SHA"],
              "n_simulations": int(os.environ["N_SIMULATIONS_INPUT"]),
              "random_seed": int(os.environ["RANDOM_SEED_INPUT"]),
              "participant_source_mode": os.environ["PARTICIPANT_SOURCE_MODE"],
              "publication": {"status": "disabled"},
          }
          Path(sys.argv[1]).write_text(
              json.dumps(document, indent=2, sort_keys=True) + "\n"
          )
          PY

      - name: Build isolated Final Climb bundle
        working-directory: external/ski/elo/python/ski/polars
        run: |
          replay_args=()
          if [[ "$HISTORICAL_RESULTS_REPLAY" == "true" ]]; then
            replay_args+=(--historical-results-replay)
          fi
          python3 cross_country_final_climb_inputs.py \
            --schedule "$GITHUB_WORKSPACE/$SCHEDULE_PATH" \
            --men-chrono excel365/men_chrono_elevation.csv \
            --ladies-chrono excel365/ladies_chrono_elevation.csv \
            --aliases excel365/fis_identity_aliases.csv \
            --logical-date "$AS_OF_DATE" \
            --output-dir "$BUNDLE_ROOT" \
            "${replay_args[@]}"

      - name: Inspect Final Climb bundle decision
        id: bundle
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          report = json.loads(
              (Path(os.environ["BUNDLE_ROOT"]) / "report.json").read_text()
          )
          status = report.get("status")
          if status not in {"candidate", "waiting_for_startlists", "no_work"}:
              raise SystemExit(f"unexpected Final Climb status: {status!r}")
          if report.get("publication") != {"status": "disabled"}:
              raise SystemExit("Final Climb bundle publication must remain disabled")
          expected_mode = os.environ["PARTICIPANT_SOURCE_MODE"]
          if report.get("participant_source_mode") != expected_mode:
              raise SystemExit(
                  "Final Climb participant source does not match invocation"
              )
          with Path(os.environ["GITHUB_OUTPUT"]).open("a") as output:
              output.write(f"has_work={str(status == 'candidate').lower()}\n")
              output.write(f"status={status}\n")
          print(f"Final Climb bundle status={status}")
          PY

      - name: Explain deferred Final Climb run
        if: steps.bundle.outputs.has_work != 'true'
        run: |
          echo "Final Climb shadow stopped safely with status=${{ steps.bundle.outputs.status }}."
          echo "No simulation or publication was attempted."

      - name: Set up Python validation runtime
        if: steps.bundle.outputs.has_work == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipelines/requirements-integration.txt

      - name: Install Python validation dependencies
        if: steps.bundle.outputs.has_work == 'true'
        run: python3 -m pip install -r pipelines/requirements-integration.txt

      - name: Set up R
        if: steps.bundle.outputs.has_work == 'true'
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install R simulation dependencies
        if: steps.bundle.outputs.has_work == 'true'
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::dplyr
            any::leaps
            any::logger
            any::lubridate
            any::mgcv
            any::purrr
            any::tidyr
            any::writexl

      - name: Run publication-disabled Final Climb simulation
        if: steps.bundle.outputs.has_work == 'true'
        env:
          NORDIC_FINAL_CLIMB_RUNTIME_ROOT: ${{ env.BUNDLE_ROOT }}
          NORDIC_SKI_DATA_ROOT: ${{ github.workspace }}/external/ski/elo/python/ski/polars/excel365
          NORDIC_PREDICTION_OUTPUT_ROOT: ${{ env.PREDICTION_ROOT }}
          NORDIC_LOG_ROOT: ${{ env.LOG_ROOT }}
          NORDIC_LOGICAL_DATE: ${{ env.LOGICAL_DATE }}
          NORDIC_N_SIMULATIONS: ${{ env.N_SIMULATIONS }}
          NORDIC_RANDOM_SEED: ${{ env.RANDOM_SEED }}
        run: Rscript content/post/cross-country/drafts/final_climb-simulation.R

      - name: Validate Final Climb shadow workbooks and manifest
        if: steps.bundle.outputs.has_work == 'true'
        run: |
          python3 -m pipelines.cross_country_final_climb_shadow \
            --runtime-dir "$BUNDLE_ROOT" \
            --prediction-root "$PREDICTION_ROOT" \
            --logical-date "$LOGICAL_DATE" \
            --n-simulations "$N_SIMULATIONS" \
            --random-seed "$RANDOM_SEED" \
            --report "$VALIDATION_REPORT"

      - name: Enforce publication lock
        if: steps.bundle.outputs.has_work == 'true'
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          validation = json.loads(Path(os.environ["VALIDATION_REPORT"]).read_text())
          if validation.get("status") != "passed":
              raise SystemExit("Final Climb shadow validation did not pass")
          if validation.get("publication") != {"status": "disabled"}:
              raise SystemExit("Final Climb publication lock was not retained")
          print("Final Climb shadow passed with publication disabled")
          PY

      - name: Build publication-disabled Final Climb candidate
        if: steps.bundle.outputs.has_work == 'true'
        run: |
          python3 -m pipelines.cross_country_final_climb_publication build \
            --prediction-root "$PREDICTION_ROOT" \
            --validation-report "$VALIDATION_REPORT" \
            --logical-date "$LOGICAL_DATE" \
            --output-root "$CANDIDATE_ROOT"

      - name: Set up Hugo
        if: steps.bundle.outputs.has_work == 'true'
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.134.1"
          extended: true

      - name: Render publication-disabled Final Climb candidate
        if: steps.bundle.outputs.has_work == 'true'
        run: |
          python3 -m pipelines.cross_country_final_climb_publication render \
            --blog-root "$GITHUB_WORKSPACE" \
            --candidate-root "$CANDIDATE_ROOT" \
            --logical-date "$LOGICAL_DATE" \
            --destination "$SITE_ROOT" \
            --report "$RENDER_REPORT"

      - name: Install validated Final Climb candidate
        if: >-
          steps.bundle.outputs.has_work == 'true' &&
          env.PARTICIPANT_SOURCE_MODE == 'official_startlist'
        run: |
          python3 -m pipelines.cross_country_final_climb_publication install \
            --candidate-root "$CANDIDATE_ROOT" \
            --render-report "$RENDER_REPORT" \
            --rendered-site-root "$SITE_ROOT" \
            --logical-date "$LOGICAL_DATE" \
            --as-of "$AS_OF_DATE" \
            --repository-root "$GITHUB_WORKSPACE"

      - name: Publish validated Final Climb predictions
        if: >-
          steps.bundle.outputs.has_work == 'true' &&
          env.PARTICIPANT_SOURCE_MODE == 'official_startlist'
        env:
          SKI_SHA: ${{ steps.ski.outputs.sha }}
        run: |
          date_key="${LOGICAL_DATE//-/}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            "content/post/final-climb-picks/$date_key.md" \
            "data/cross-country/drafts/final-climb-picks/$date_key/men.json" \
            "data/cross-country/drafts/final-climb-picks/$date_key/ladies.json" \
            "data/cross-country/drafts/final-climb-picks/$date_key/men_position_probabilities.json" \
            "data/cross-country/drafts/final-climb-picks/$date_key/ladies_position_probabilities.json"
          status=unchanged
          if git diff --cached --quiet; then
            echo "Validated Final Climb prediction artifacts are already current."
          else
            git commit -m "Publish Final Climb predictions for $date_key" \
              -m "Ski source: $SKI_SHA"
            git pull --rebase origin main
            git push origin HEAD:main
            status=published
          fi
          python3 - "$SHADOW_ROOT/publication_report.json" "$status" \
            "$LOGICAL_DATE" "$(git rev-parse HEAD)" <<'PY'
          import json
          import sys
          from pathlib import Path

          date_key = sys.argv[3].replace("-", "")
          report = {
              "schema_version": "nordicnumbers.cross-country-final-climb-publication/v1",
              "status": sys.argv[2],
              "logical_date": sys.argv[3],
              "participant_source_mode": "official_startlist",
              "commit": sys.argv[4],
              "files": [
                  f"content/post/final-climb-picks/{date_key}.md",
                  f"data/cross-country/drafts/final-climb-picks/{date_key}/men.json",
                  f"data/cross-country/drafts/final-climb-picks/{date_key}/ladies.json",
                  f"data/cross-country/drafts/final-climb-picks/{date_key}/men_position_probabilities.json",
                  f"data/cross-country/drafts/final-climb-picks/{date_key}/ladies_position_probabilities.json",
              ],
          }
          Path(sys.argv[1]).write_text(
              json.dumps(report, indent=2, sort_keys=True) + "\n"
          )
          PY

      - name: Retain complete Final Climb shadow evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cross-country-final-climb-shadow-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 30
          path: ${{ runner.temp }}/cross-country-final-climb-shadow/
