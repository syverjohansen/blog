name: Nordic Numbers nightly coordinator

on:
  schedule:
    - cron: "15 0 * * *"
  workflow_dispatch:
    inputs:
      as_of:
        description: Results cutoff (YYYY-MM-DD); defaults to the current America/New_York date
        required: false
        type: string

permissions:
  actions: write
  contents: read

concurrency:
  group: nordic-numbers-nightly-coordinator
  cancel-in-progress: false

jobs:
  dispatch:
    name: Start ${{ matrix.sport }} lifecycle
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - sport: alpine
            workflow: alpine-site-data-update.yml
          - sport: cross-country
            workflow: cross-country-site-data-update.yml
          - sport: biathlon
            workflow: biathlon-site-data-update.yml
          - sport: ski-jumping
            workflow: ski-jumping-schedule-update.yml
          - sport: nordic-combined
            workflow: nordic-combined-schedule-update.yml
    steps:
      - name: Dispatch independent sport lifecycle
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW: ${{ matrix.workflow }}
          REQUESTED_AS_OF: ${{ inputs.as_of || '' }}
        run: |
          as_of="${REQUESTED_AS_OF:-$(TZ=America/New_York date +%F)}"
          if ! [[ "$as_of" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
            echo "Invalid as_of date: $as_of" >&2
            exit 1
          fi
          gh workflow view "$WORKFLOW" --repo "$GITHUB_REPOSITORY" >/dev/null
          gh workflow run "$WORKFLOW" \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f as_of="$as_of"
          echo "Dispatched $WORKFLOW through completed results dated $as_of." >> "$GITHUB_STEP_SUMMARY"
