name: Cross-country prediction Elo shadow comparison

on:
  workflow_dispatch:
    inputs:
      logical_date:
        description: Run date (YYYY-MM-DD); active weekends resolve to their stable group date
        required: false
        type: string
      n_simulations:
        description: Identical Monte Carlo iteration count for both candidates
        required: true
        default: 250
        type: number
      random_seed:
        description: Identical deterministic simulation seed for both candidates
        required: true
        default: 20261127
        type: number
      ski_ref:
        description: Ski branch, tag, or commit to resolve and record
        required: true
        default: main
        type: string

permissions:
  contents: read

concurrency:
  group: cross-country-prediction-elo-shadow
  cancel-in-progress: false

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Check out bounded blog runtime
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /pipelines/cross_country_prediction_elo_comparison.py
            /pipelines/cross_country_weekend_consumer.py
            /pipelines/cross_country_weekend_shadow.py
            /pipelines/requirements-integration.txt
            /pipelines/requirements-snapshot.txt
            /content/post/cross-country/drafts/weekly-picks-simulation.R
            /content/post/shared/sport_params.R

      - name: Resolve ski source to an exact commit
        id: ski
        env:
          GH_TOKEN: ${{ github.token }}
          SKI_REF: ${{ inputs.ski_ref || 'main' }}
        run: |
          ski_sha=$(gh api "repos/syverjohansen/ski/commits/$SKI_REF" --jq .sha)
          if [[ ! "$ski_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Unable to resolve ski ref: $SKI_REF" >&2
            exit 1
          fi
          echo "sha=$ski_sha" >> "$GITHUB_OUTPUT"

      - name: Check out bounded ski runtime
        uses: actions/checkout@v4
        with:
          repository: syverjohansen/ski
          ref: ${{ steps.ski.outputs.sha }}
          path: external/ski
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /elo/python/ski/polars/cross_country_fis_prediction_acquire.py
            /elo/python/ski/polars/cross_country_fis_prediction_identity.py
            /elo/python/ski/polars/cross_country_fis_prediction_replay.py
            /elo/python/ski/polars/cross_country_prediction_elo_pipeline.py
            /elo/python/ski/polars/cross_country_prediction_elo_policy.json
            /elo/python/ski/polars/cross_country_prediction_elo_shadow.py
            /elo/python/ski/polars/cross_country_prediction_sources.py
            /elo/python/ski/polars/cross_country_results_backfill.py
            /elo/python/ski/polars/cross_country_results_elo_replay.py
            /elo/python/ski/polars/cross_country_results_gap.py
            /elo/python/ski/polars/cross_country_results_identity.py
            /elo/python/ski/polars/cross_country_schedule_scraper.py
            /elo/python/ski/polars/cross_country_weekend_inputs.py
            /elo/python/ski/polars/schedule_contract.py
            /elo/python/ski/polars/schedule_sources.py
            /elo/python/ski/polars/excel365/races.csv
            /elo/python/ski/polars/excel365/weekends.csv
            /elo/python/ski/polars/excel365/men_chrono_elevation.csv
            /elo/python/ski/polars/excel365/ladies_chrono_elevation.csv
            /elo/python/ski/polars/excel365/fis_identity_aliases.csv

      - name: Prepare immutable comparison parameters
        id: prepare
        env:
          LOGICAL_DATE_INPUT: ${{ inputs.logical_date || '' }}
          N_SIMULATIONS_INPUT: ${{ inputs.n_simulations || 250 }}
          RANDOM_SEED_INPUT: ${{ inputs.random_seed || 20261127 }}
          SKI_SHA: ${{ steps.ski.outputs.sha }}
        run: |
          as_of="${LOGICAL_DATE_INPUT:-$(date -u +%F)}"
          python3 - "$as_of" "$N_SIMULATIONS_INPUT" "$RANDOM_SEED_INPUT" <<'PY'
          from datetime import date
          import sys

          date.fromisoformat(sys.argv[1])
          if int(sys.argv[2]) < 1:
              raise SystemExit("n_simulations must be positive")
          int(sys.argv[3])
          PY
          logical_date=$(python3 - \
            external/ski/elo/python/ski/polars/excel365/weekends.csv \
            "$as_of" <<'PY'
          import csv
          from datetime import date, datetime
          import sys

          as_of = date.fromisoformat(sys.argv[2])
          groups = {}
          with open(sys.argv[1], newline="", encoding="utf-8-sig") as handle:
              reader = csv.DictReader(handle)
              required = {"Date", "Race_Date", "Distance", "Stage"}
              if missing := sorted(required - set(reader.fieldnames or ())):
                  raise SystemExit(f"weekend schedule is missing columns: {missing}")
              for row in reader:
                  if row["Distance"] in {"Rel", "Ts"} or row["Stage"] == "1":
                      continue
                  group = datetime.strptime(row["Date"], "%m/%d/%Y").date()
                  raced = datetime.strptime(row["Race_Date"], "%m/%d/%Y").date()
                  groups.setdefault(group, []).append(raced)
          active = sorted(
              group
              for group, race_dates in groups.items()
              if group <= as_of <= max(race_dates)
          )
          if len(active) > 1:
              raise SystemExit(f"multiple active weekend groups: {active}")
          print((active[0] if active else as_of).isoformat())
          PY
          )
          fis_season=$(python3 - "$logical_date" <<'PY'
          from datetime import date
          import sys

          observed = date.fromisoformat(sys.argv[1])
          print(observed.year + 1 if observed.month >= 7 else observed.year)
          PY
          )
          blog_sha=$(git rev-parse HEAD)
          root="$RUNNER_TEMP/cross-country-prediction-elo-shadow"
          mkdir -p "$root/reports"
          {
            echo "LOGICAL_DATE=$logical_date"
            echo "FIS_SEASON=$fis_season"
            echo "N_SIMULATIONS=$N_SIMULATIONS_INPUT"
            echo "RANDOM_SEED=$RANDOM_SEED_INPUT"
            echo "SHADOW_ROOT=$root"
            echo "BUNDLE_ROOT=$root/bundle"
            echo "LEDGER_ROOT=$root/ledger"
            echo "RATING_ROOT=$root/ratings"
            echo "BASELINE_RUNTIME=$root/runtime-baseline"
            echo "CANDIDATE_RUNTIME=$root/runtime-k4"
            echo "BASELINE_PREDICTIONS=$root/predictions-baseline"
            echo "CANDIDATE_PREDICTIONS=$root/predictions-k4"
            echo "BASELINE_LOG=$root/logs-baseline"
            echo "CANDIDATE_LOG=$root/logs-k4"
            echo "BASELINE_VALIDATION=$root/reports/validation-baseline.json"
            echo "CANDIDATE_VALIDATION=$root/reports/validation-k4.json"
            echo "COMPARISON_ROOT=$root/comparison"
          } >> "$GITHUB_ENV"
          python3 - "$root/run_metadata.json" "$logical_date" "$as_of" \
            "$blog_sha" "$SKI_SHA" "$fis_season" \
            "$N_SIMULATIONS_INPUT" "$RANDOM_SEED_INPUT" <<'PY'
          import json
          import sys
          from pathlib import Path

          document = {
              "schema_version": "nordicnumbers.cross-country-prediction-elo-shadow-run/v1",
              "logical_date": sys.argv[2],
              "as_of_date": sys.argv[3],
              "blog_commit": sys.argv[4],
              "ski_commit": sys.argv[5],
              "fis_season": int(sys.argv[6]),
              "n_simulations": int(sys.argv[7]),
              "random_seed": int(sys.argv[8]),
              "candidate_k_factor": 4.0,
              "publication": {"status": "disabled"},
          }
          Path(sys.argv[1]).write_text(
              json.dumps(document, indent=2, sort_keys=True) + "\n"
          )
          PY

      - name: Build official weekend comparison bundle
        working-directory: external/ski/elo/python/ski/polars
        run: |
          python3 cross_country_weekend_inputs.py \
            --schedule excel365/weekends.csv \
            --men-chrono excel365/men_chrono_elevation.csv \
            --ladies-chrono excel365/ladies_chrono_elevation.csv \
            --aliases excel365/fis_identity_aliases.csv \
            --group-date "$LOGICAL_DATE" \
            --output-dir "$BUNDLE_ROOT" \
            --prediction-shadow

      - name: Inspect official comparison eligibility
        id: bundle
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          report = json.loads(
              (Path(os.environ["BUNDLE_ROOT"]) / "report.json").read_text()
          )
          status = report.get("status")
          if status not in {"candidate", "no_work"}:
              raise SystemExit(f"unexpected bundle status: {status!r}")
          if report.get("publication") != {"status": "disabled"}:
              raise SystemExit("bundle publication must remain disabled")
          official = status == "candidate" and all(
              event.get("source_mode") == "official_fis_startlist"
              for event in report.get("events", [])
          )
          with Path(os.environ["GITHUB_OUTPUT"]).open("a") as output:
              output.write(f"has_work={str(status == 'candidate').lower()}\n")
              output.write(f"official_ready={str(official).lower()}\n")
          print(f"bundle status={status}; official comparison ready={official}")
          PY

      - name: Explain deferred comparison
        if: steps.bundle.outputs.official_ready != 'true'
        run: |
          if [[ "${{ steps.bundle.outputs.has_work }}" == "true" ]]; then
            echo "Comparison deferred until every race has an official FIS startlist."
          else
            echo "No normal individual cross-country weekend is grouped on $LOGICAL_DATE."
          fi

      - name: Set up Python validation runtime
        if: steps.bundle.outputs.official_ready == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pipelines/requirements-integration.txt
            pipelines/requirements-snapshot.txt

      - name: Install Python validation dependencies
        if: steps.bundle.outputs.official_ready == 'true'
        run: python3 -m pip install -r pipelines/requirements-integration.txt

      - name: Build current private K4 prediction ledger
        if: steps.bundle.outputs.official_ready == 'true'
        working-directory: external/ski/elo/python/ski/polars
        run: |
          python3 cross_country_prediction_elo_pipeline.py \
            --season "$FIS_SEASON" \
            --as-of "$LOGICAL_DATE" \
            --accepted-schedule excel365/races.csv \
            --men-chrono excel365/men_chrono_elevation.csv \
            --ladies-chrono excel365/ladies_chrono_elevation.csv \
            --aliases excel365/fis_identity_aliases.csv \
            --policy cross_country_prediction_elo_policy.json \
            --output-dir "$LEDGER_ROOT" \
            --allow-network

      - name: Build private rating overlays
        if: steps.bundle.outputs.official_ready == 'true'
        working-directory: external/ski/elo/python/ski/polars
        run: |
          for gender in men ladies; do
            startlist="$BUNDLE_ROOT/${gender}_startlist.csv"
            if [[ $(wc -l < "$startlist") -le 1 ]]; then
              continue
            fi
            python3 cross_country_prediction_elo_shadow.py \
              --startlist "$startlist" \
              --men-chrono excel365/men_chrono_elevation.csv \
              --ladies-chrono excel365/ladies_chrono_elevation.csv \
              --prediction-ledger "$LEDGER_ROOT/fis-prediction-ledger.csv" \
              --policy cross_country_prediction_elo_policy.json \
              --output-dir "$RATING_ROOT/$gender"
          done

      - name: Materialize identical baseline and K4 runtimes
        if: steps.bundle.outputs.official_ready == 'true'
        run: |
          python3 -m pipelines.cross_country_weekend_consumer \
            --bundle-dir "$BUNDLE_ROOT" \
            --logical-date "$LOGICAL_DATE" \
            --output-dir "$BASELINE_RUNTIME"
          python3 -m pipelines.cross_country_weekend_consumer \
            --bundle-dir "$BUNDLE_ROOT" \
            --logical-date "$LOGICAL_DATE" \
            --prediction-elo-root "$RATING_ROOT" \
            --output-dir "$CANDIDATE_RUNTIME"

      - name: Set up R
        if: steps.bundle.outputs.official_ready == 'true'
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install R simulation dependencies
        if: steps.bundle.outputs.official_ready == 'true'
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::dplyr
            any::leaps
            any::logger
            any::lubridate
            any::mgcv
            any::purrr
            any::tidyr
            any::writexl

      - name: Run baseline simulation
        if: steps.bundle.outputs.official_ready == 'true'
        env:
          NORDIC_BLOG_ROOT: ${{ github.workspace }}
          NORDIC_WEEKEND_RUNTIME_ROOT: ${{ env.BASELINE_RUNTIME }}
          NORDIC_SKI_DATA_ROOT: ${{ github.workspace }}/external/ski/elo/python/ski/polars/excel365
          NORDIC_PREDICTION_OUTPUT_ROOT: ${{ env.BASELINE_PREDICTIONS }}
          NORDIC_LOG_ROOT: ${{ env.BASELINE_LOG }}
          NORDIC_LOGICAL_DATE: ${{ env.LOGICAL_DATE }}
          NORDIC_N_SIMULATIONS: ${{ env.N_SIMULATIONS }}
          NORDIC_RANDOM_SEED: ${{ env.RANDOM_SEED }}
        run: Rscript content/post/cross-country/drafts/weekly-picks-simulation.R

      - name: Run K4 candidate simulation
        if: steps.bundle.outputs.official_ready == 'true'
        env:
          NORDIC_BLOG_ROOT: ${{ github.workspace }}
          NORDIC_WEEKEND_RUNTIME_ROOT: ${{ env.CANDIDATE_RUNTIME }}
          NORDIC_SKI_DATA_ROOT: ${{ github.workspace }}/external/ski/elo/python/ski/polars/excel365
          NORDIC_PREDICTION_OUTPUT_ROOT: ${{ env.CANDIDATE_PREDICTIONS }}
          NORDIC_LOG_ROOT: ${{ env.CANDIDATE_LOG }}
          NORDIC_LOGICAL_DATE: ${{ env.LOGICAL_DATE }}
          NORDIC_N_SIMULATIONS: ${{ env.N_SIMULATIONS }}
          NORDIC_RANDOM_SEED: ${{ env.RANDOM_SEED }}
        run: Rscript content/post/cross-country/drafts/weekly-picks-simulation.R

      - name: Validate both shadow outputs
        if: steps.bundle.outputs.official_ready == 'true'
        run: |
          python3 -m pipelines.cross_country_weekend_shadow \
            --runtime-dir "$BASELINE_RUNTIME" \
            --prediction-root "$BASELINE_PREDICTIONS" \
            --logical-date "$LOGICAL_DATE" \
            --n-simulations "$N_SIMULATIONS" \
            --random-seed "$RANDOM_SEED" \
            --report "$BASELINE_VALIDATION"
          python3 -m pipelines.cross_country_weekend_shadow \
            --runtime-dir "$CANDIDATE_RUNTIME" \
            --prediction-root "$CANDIDATE_PREDICTIONS" \
            --logical-date "$LOGICAL_DATE" \
            --n-simulations "$N_SIMULATIONS" \
            --random-seed "$RANDOM_SEED" \
            --report "$CANDIDATE_VALIDATION"

      - name: Compare baseline and K4 full prediction pools
        if: steps.bundle.outputs.official_ready == 'true'
        run: |
          date_key="${LOGICAL_DATE//-/}"
          python3 -m pipelines.cross_country_prediction_elo_comparison \
            --baseline "$BASELINE_PREDICTIONS/$date_key/weekend_fantasy_inputs.xlsx" \
            --candidate "$CANDIDATE_PREDICTIONS/$date_key/weekend_fantasy_inputs.xlsx" \
            --output-dir "$COMPARISON_ROOT"

      - name: Retain complete comparison evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cross-country-prediction-elo-shadow-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 30
          path: ${{ runner.temp }}/cross-country-prediction-elo-shadow/
