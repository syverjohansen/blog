name: Alpine Historical Shadow Parity

on:
  workflow_dispatch:
    inputs:
      n_simulations:
        description: Deterministic Monte Carlo iteration count
        required: true
        default: 250
        type: number

permissions:
  contents: read

concurrency:
  group: alpine-shadow-${{ github.ref }}
  cancel-in-progress: false

jobs:
  parity:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out blog source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /pipelines/
            /content/post/alpine/drafts/race-picks-simulation.R
            /content/post/shared/
            /static/python/excel_to_hugo_multiple_sheets.py
            /layouts/
            /themes/white/
            /data/alpine/drafts/race-picks/20260325/
            /tests/pipeline/

      - name: Fetch immutable Alpine parity inputs
        run: |
          input_manifest="$GITHUB_WORKSPACE/tests/pipeline/alpine-parity-inputs.json"
          ski_sha=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["ski_commit_sha"])' "$input_manifest")
          logical_date=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["logical_date"])' "$input_manifest")
          mapfile -t files < <(python3 -c 'import json,sys; print("\n".join(json.load(open(sys.argv[1]))["files"]))' "$input_manifest")
          mkdir -p external/ski-input
          base="https://raw.githubusercontent.com/syverjohansen/ski/$ski_sha/elo/python/alpine/polars/excel365"
          for file in "${files[@]}"; do
            curl --fail --location --retry 3 --retry-all-errors \
              --output "external/ski-input/$file" "$base/$file"
          done
          python3 pipelines/verify_pinned_inputs.py \
            --manifest "$input_manifest" \
            --input-root external/ski-input
          echo "SKI_SHA=$ski_sha" >> "$GITHUB_ENV"
          echo "ALPINE_PARITY_LOGICAL_DATE=$logical_date" >> "$GITHUB_ENV"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipelines/requirements-integration.txt

      - name: Install Python runtime
        run: python3 -m pip install -r pipelines/requirements-integration.txt

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install R runtime
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::dplyr
            any::tidyr
            any::openxlsx
            any::mgcv
            any::leaps
            any::logger
            any::lubridate

      - name: Set up Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.134.1"
          extended: true

      - name: Run publication-disabled Alpine parity gate
        run: |
          python3 pipelines/test_pipeline.py alpine-integration \
            --logical-date "$ALPINE_PARITY_LOGICAL_DATE" \
            --n-simulations "${{ inputs.n_simulations }}" \
            --ski-input-root "$GITHUB_WORKSPACE/external/ski-input" \
            --ski-commit-sha "$SKI_SHA" \
            --report artifacts/alpine-shadow-report.json \
            --manifest artifacts/alpine-shadow-manifest.json

      - name: Enforce shadow-only result
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          manifest = json.loads(
              Path("artifacts/alpine-shadow-manifest.json").read_text(encoding="utf-8")
          )
          if manifest.get("status") != "passed":
              raise SystemExit(f"shadow manifest did not pass: {manifest.get('status')}")
          publication = manifest.get("publication", {})
          if publication.get("status") != "disabled":
              raise SystemExit(f"publication was not disabled: {publication}")
          outcomes = manifest.get("task_outcomes", [])
          failed = [item for item in outcomes if item.get("status") != "passed"]
          if failed:
              raise SystemExit(f"shadow tasks did not pass: {failed}")
          print("Alpine shadow parity passed with publication disabled")
          PY

      - name: Upload parity evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alpine-shadow-historical-${{ github.run_id }}
          path: |
            artifacts/alpine-shadow-report.json
            artifacts/alpine-shadow-manifest.json
          if-no-files-found: warn
          retention-days: 30
