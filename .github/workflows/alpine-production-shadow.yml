name: Alpine Production Shadow

on:
  workflow_dispatch:
    inputs:
      logical_date:
        description: Optional race date (YYYY-MM-DD); defaults to today in UTC
        required: false
        type: string
      expected_season:
        description: Optional FIS season ending year; derived from the date when omitted
        required: false
        type: string
      n_simulations:
        description: Deterministic Monte Carlo iteration count
        required: true
        default: 10000
        type: number
      ski_ref:
        description: Ski branch, tag, or commit to resolve and record
        required: true
        default: main
        type: string
      publish_predictions:
        description: Publish validated prediction content directly to main
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: alpine-production-shadow
  cancel-in-progress: false

jobs:
  shadow:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      logical_date: ${{ steps.prepare.outputs.logical_date }}
      run_id: ${{ steps.prepare.outputs.run_id }}
      has_race: ${{ steps.prepare.outputs.has_race }}
      artifact_name: ${{ steps.prepare.outputs.artifact_name }}

    steps:
      - name: Check out bounded blog runtime
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /pipelines/
            /content/post/alpine/drafts/race-picks-simulation.R
            /content/post/shared/
            /static/python/excel_to_hugo_multiple_sheets.py
            /layouts/
            /themes/white/

      - name: Resolve ski source to an exact commit
        id: ski
        env:
          GH_TOKEN: ${{ github.token }}
          SKI_REF: ${{ inputs.ski_ref || 'main' }}
        run: |
          ski_sha=$(gh api "repos/syverjohansen/ski/commits/$SKI_REF" --jq .sha)
          if [[ ! "$ski_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Unable to resolve ski ref: $SKI_REF" >&2
            exit 1
          fi
          echo "sha=$ski_sha" >> "$GITHUB_OUTPUT"

      - name: Check out bounded ski runtime
        uses: actions/checkout@v4
        with:
          repository: syverjohansen/ski
          ref: ${{ steps.ski.outputs.sha }}
          path: external/ski
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /elo/python/pipeline_config.py
            /elo/python/alpine/polars/alpine_startlist_replay.py
            /elo/python/alpine/polars/alpine_results_identity.py
            /elo/python/alpine/polars/startlist-scrape-races.py
            /elo/python/alpine/polars/startlist_common.py
            /elo/python/alpine/polars/requirements-startlist-replay.txt
            /elo/python/alpine/polars/excel365/races.csv
            /elo/python/alpine/polars/excel365/men_chrono.csv
            /elo/python/alpine/polars/excel365/ladies_chrono.csv
            /elo/python/alpine/polars/excel365/fis_identity_aliases.csv

      - name: Isolate the nested ski checkout from blog provenance
        run: |
          printf '/external/\n' >> "$GITHUB_WORKSPACE/.git/info/exclude"
          if [[ -n "$(git -C "$GITHUB_WORKSPACE" status --porcelain)" ]]; then
            echo "Blog checkout is unexpectedly dirty" >&2
            git -C "$GITHUB_WORKSPACE" status --short >&2
            exit 1
          fi
          if [[ -n "$(git -C "$GITHUB_WORKSPACE/external/ski" status --porcelain)" ]]; then
            echo "Ski checkout is unexpectedly dirty" >&2
            git -C "$GITHUB_WORKSPACE/external/ski" status --short >&2
            exit 1
          fi

      - name: Prepare immutable run parameters
        id: prepare
        env:
          LOGICAL_DATE_INPUT: ${{ inputs.logical_date || '' }}
          EXPECTED_SEASON_INPUT: ${{ inputs.expected_season || '' }}
          N_SIMULATIONS_INPUT: ${{ inputs.n_simulations || 10000 }}
        run: |
          logical_date="${LOGICAL_DATE_INPUT:-$(date -u '+%Y-%m-%d')}"
          expected_season="$EXPECTED_SEASON_INPUT"
          if [[ -z "$expected_season" ]]; then
            year="${logical_date:0:4}"
            month="${logical_date:5:2}"
            if ((10#$month >= 7)); then
              expected_season=$((10#$year + 1))
            else
              expected_season=$((10#$year))
            fi
          fi

          run_id="github-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          output_root="$RUNNER_TEMP/alpine-production-shadow"
          manifest_path="$output_root/runs/$run_id/manifests/alpine-run-manifest-final.json"
          artifact_name="alpine-production-shadow-${logical_date}-${GITHUB_RUN_ID}"
          mkdir -p "$output_root"

          {
            echo "LOGICAL_DATE=$logical_date"
            echo "EXPECTED_SEASON=$expected_season"
            echo "N_SIMULATIONS=$N_SIMULATIONS_INPUT"
            echo "RUN_ID=$run_id"
            echo "OUTPUT_ROOT=$output_root"
            echo "MANIFEST_PATH=$manifest_path"
          } >> "$GITHUB_ENV"
          {
            echo "logical_date=$logical_date"
            echo "run_id=$run_id"
            echo "artifact_name=$artifact_name"
          } >> "$GITHUB_OUTPUT"

          export LOGICAL_DATE="$logical_date"
          python3 - <<'PY'
          import csv
          import os
          from datetime import date
          from pathlib import Path

          logical_date = date.fromisoformat(os.environ["LOGICAL_DATE"])
          target = logical_date.strftime("%m/%d/%Y")
          schedule = Path(
              "external/ski/elo/python/alpine/polars/excel365/races.csv"
          )
          with schedule.open(newline="", encoding="utf-8-sig") as handle:
              rows = csv.DictReader(handle)
              has_race = any(
                  (row.get("Date") or "").strip() == target
                  and (row.get("Sex") or "").strip() in {"M", "L"}
                  for row in rows
              )
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as out:
              out.write(f"has_race={str(has_race).lower()}\n")
          print(f"logical_date={logical_date} has_race={has_race}")
          PY

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pipelines/requirements-integration.txt
            external/ski/elo/python/alpine/polars/requirements-startlist-replay.txt

      - name: Install race-day Python runtime
        if: steps.prepare.outputs.has_race == 'true'
        run: |
          python3 -m pip install \
            -r pipelines/requirements-integration.txt \
            -r external/ski/elo/python/alpine/polars/requirements-startlist-replay.txt

      - name: Set up race-day R runtime
        if: steps.prepare.outputs.has_race == 'true'
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install race-day R packages
        if: steps.prepare.outputs.has_race == 'true'
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::dplyr
            any::tidyr
            any::openxlsx
            any::mgcv
            any::leaps
            any::logger
            any::lubridate

      - name: Set up race-day Hugo runtime
        if: steps.prepare.outputs.has_race == 'true'
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.134.1"
          extended: true

      - name: Run publication-disabled production shadow
        id: run_shadow
        continue-on-error: true
        run: |
          set -o pipefail
          python3 -m pipelines.alpine_shadow_runner \
            --blog-root "$GITHUB_WORKSPACE" \
            --ski-root "$GITHUB_WORKSPACE/external/ski" \
            --output-root "$OUTPUT_ROOT" \
            --logical-date "$LOGICAL_DATE" \
            --expected-season "$EXPECTED_SEASON" \
            --n-simulations "$N_SIMULATIONS" \
            --run-id "$RUN_ID" \
            --allow-network \
            --skip-no-race \
            2>&1 | tee "$OUTPUT_ROOT/runner.log"

      - name: Enforce retained shadow result
        if: always()
        env:
          RUNNER_OUTCOME: ${{ steps.run_shadow.outcome }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path(os.environ["MANIFEST_PATH"])
          if not path.is_file():
              raise SystemExit(f"shadow manifest is missing: {path}")
          manifest = json.loads(path.read_text(encoding="utf-8"))
          if manifest.get("publication", {}).get("status") != "disabled":
              raise SystemExit("shadow run did not keep publication disabled")
          status = manifest.get("status")
          outcome = os.environ["RUNNER_OUTCOME"]
          if outcome != "success" or status not in {"passed", "skipped"}:
              raise SystemExit(
                  f"shadow run failed: runner_outcome={outcome} status={status}"
              )
          print(f"shadow run retained with status={status}: {path}")
          PY

      - name: Upload complete shadow evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.prepare.outputs.artifact_name }}
          path: |
            ${{ runner.temp }}/alpine-production-shadow/runner.log
            ${{ runner.temp }}/alpine-production-shadow/runs/
          if-no-files-found: warn
          retention-days: 30

  publish_prediction_post:
    name: Publish validated prediction post
    needs: shadow
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.publish_predictions == true &&
      needs.shadow.result == 'success' &&
      needs.shadow.outputs.has_race == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Check out publication base
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Download the exact passed shadow artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.shadow.outputs.artifact_name }}
          path: ${{ runner.temp }}/shadow-artifact

      - name: Materialize validated publication candidate
        id: candidate
        env:
          LOGICAL_DATE: ${{ needs.shadow.outputs.logical_date }}
          RUN_ID: ${{ needs.shadow.outputs.run_id }}
        run: |
          run_root="$RUNNER_TEMP/shadow-artifact/runs/$RUN_ID"
          report="$RUNNER_TEMP/alpine-publication-candidate.json"
          python3 -m pipelines.alpine_publication_candidate \
            --manifest "$run_root/manifests/alpine-run-manifest-final.json" \
            --replay-report "$run_root/acquisition/reports/replay.json" \
            --actual-results "$run_root/acquisition/reports/actual-results.json" \
            --site-data-root "$run_root/workspace/site-data" \
            --repository-root "$GITHUB_WORKSPACE" \
            --report "$report"

          date_key="${LOGICAL_DATE//-/}"
          if [[ -z "$(git status --porcelain -- \
            "data/alpine/drafts/race-picks/$date_key" \
            "content/post/race-picks/$date_key.md")" ]]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
          echo "date_key=$date_key" >> "$GITHUB_OUTPUT"
          echo "report=$report" >> "$GITHUB_OUTPUT"

      - name: Set up Hugo for final repository render
        if: steps.candidate.outputs.changed == 'true'
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.134.1"
          extended: true

      - name: Render the complete publication candidate
        if: steps.candidate.outputs.changed == 'true'
        run: hugo --minify --destination "$RUNNER_TEMP/alpine-publication-site"

      - name: Publish validated prediction post
        if: steps.candidate.outputs.changed == 'true'
        env:
          DATE_KEY: ${{ steps.candidate.outputs.date_key }}
          LOGICAL_DATE: ${{ needs.shadow.outputs.logical_date }}
          RUN_ID: ${{ needs.shadow.outputs.run_id }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            "data/alpine/drafts/race-picks/$DATE_KEY" \
            "content/post/race-picks/$DATE_KEY.md"
          git commit -m "Add Alpine race picks for $LOGICAL_DATE"
          git push origin HEAD:main
          echo "Published validated race picks for $LOGICAL_DATE from shadow run $RUN_ID." >> "$GITHUB_STEP_SUMMARY"

      - name: Upload publication candidate report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alpine-publication-report-${{ needs.shadow.outputs.logical_date }}-${{ github.run_id }}
          path: ${{ runner.temp }}/alpine-publication-candidate.json
          if-no-files-found: warn
          retention-days: 30
