name: Alpine Current-Season Smoke

on:
  workflow_dispatch:
    inputs:
      logical_date:
        description: Race date to validate and simulate (YYYY-MM-DD)
        required: true
        type: string
      expected_season:
        description: Expected FIS season ending year
        required: true
        default: 2027
        type: number
      n_simulations:
        description: Deterministic Monte Carlo iteration count
        required: true
        default: 50
        type: number
      ski_ref:
        description: Current ski branch, tag, or commit
        required: true
        default: main
        type: string

permissions:
  contents: read

concurrency:
  group: alpine-current-smoke-${{ github.ref }}
  cancel-in-progress: false

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out bounded blog runtime
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /pipelines/
            /content/post/alpine/drafts/race-picks-simulation.R
            /content/post/shared/
            /static/python/excel_to_hugo_multiple_sheets.py
            /layouts/
            /themes/white/

      - name: Resolve the ski source to an exact commit
        id: ski
        env:
          SKI_REF: ${{ inputs.ski_ref }}
          GH_TOKEN: ${{ github.token }}
        run: |
          ski_sha=$(gh api "repos/syverjohansen/ski/commits/$SKI_REF" --jq .sha)
          if [[ ! "$ski_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Unable to resolve ski ref: $SKI_REF" >&2
            exit 1
          fi
          echo "sha=$ski_sha" >> "$GITHUB_OUTPUT"
          echo "SKI_SHA=$ski_sha" >> "$GITHUB_ENV"

      - name: Check out the exact ski scraper runtime
        uses: actions/checkout@v4
        with:
          repository: syverjohansen/ski
          ref: ${{ steps.ski.outputs.sha }}
          path: external/ski
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /elo/python/pipeline_config.py
            /elo/python/alpine/polars/alpine_startlist_replay.py
            /elo/python/alpine/polars/startlist-scrape-races.py
            /elo/python/alpine/polars/startlist_common.py
            /elo/python/alpine/polars/requirements-startlist-replay.txt
            /elo/python/alpine/polars/excel365/races.csv
            /elo/python/alpine/polars/excel365/men_chrono.csv
            /elo/python/alpine/polars/excel365/ladies_chrono.csv

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipelines/requirements-integration.txt

      - name: Install Python runtime
        run: |
          python3 -m pip install \
            -r pipelines/requirements-integration.txt \
            -r external/ski/elo/python/alpine/polars/requirements-startlist-replay.txt

      - name: Build isolated current Alpine inputs
        id: build_inputs
        run: |
          set -o pipefail
          mkdir -p artifacts
          python3 external/ski/elo/python/alpine/polars/startlist-scrape-races.py shadow \
            --logical-date "${{ inputs.logical_date }}" \
            --races external/ski/elo/python/alpine/polars/excel365/races.csv \
            --men-history external/ski/elo/python/alpine/polars/excel365/men_chrono.csv \
            --ladies-history external/ski/elo/python/alpine/polars/excel365/ladies_chrono.csv \
            --output-dir "$GITHUB_WORKSPACE/external/ski-input" \
            --allow-network 2>&1 | tee artifacts/alpine-input-build.log

      - name: Enforce scraper handoff contract
        id: enforce_handoff
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(
              Path("external/ski-input/reports/replay.json").read_text(
                  encoding="utf-8"
              )
          )
          if report.get("status") != "passed":
              raise SystemExit(f"ski shadow scraper failed: {report}")
          if report.get("publication", {}).get("status") != "disabled":
              raise SystemExit("ski shadow scraper did not disable publication")
          allowed = {"historical_result_proxy", "generated_pre_race_history"}
          races = report.get("races", [])
          if not races or any(race.get("source") not in allowed for race in races):
              raise SystemExit(f"unexpected startlist provenance: {races}")
          if any(race.get("athletes", 0) < 1 for race in races):
              raise SystemExit(f"empty startlist handoff: {races}")
          if any(race.get("result_fields_in_prediction_input") is not False for race in races):
              raise SystemExit(f"result leakage reported by scraper: {races}")
          print("Ski scraper handoff passed:", races)
          PY

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install R runtime
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::dplyr
            any::tidyr
            any::openxlsx
            any::mgcv
            any::leaps
            any::logger
            any::lubridate

      - name: Set up Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.134.1"
          extended: true

      - name: Run publication-disabled current-season smoke
        id: current_smoke
        run: |
          python3 pipelines/test_pipeline.py alpine-current-smoke \
            --logical-date "${{ inputs.logical_date }}" \
            --expected-season "${{ inputs.expected_season }}" \
            --n-simulations "${{ inputs.n_simulations }}" \
            --ski-input-root "$GITHUB_WORKSPACE/external/ski-input" \
            --ski-commit-sha "$SKI_SHA" \
            --report artifacts/alpine-current-smoke-report.json \
            --manifest artifacts/alpine-current-smoke-manifest.json

      - name: Enforce smoke-only result
        id: enforce_smoke
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          manifest = json.loads(
              Path("artifacts/alpine-current-smoke-manifest.json").read_text(
                  encoding="utf-8"
              )
          )
          if manifest.get("status") != "passed":
              raise SystemExit(f"current smoke did not pass: {manifest.get('status')}")
          publication = manifest.get("publication", {})
          if publication.get("status") != "disabled":
              raise SystemExit(f"publication was not disabled: {publication}")
          readiness = manifest.get("quality_results", {}).get(
              "current_input_readiness", {}
          )
          if readiness.get("status") != "passed":
              raise SystemExit(f"current inputs were not ready: {readiness}")
          print("Current-season smoke passed with publication disabled")
          PY

      - name: Write failure evidence when the smoke manifest is absent
        if: always()
        env:
          BUILD_INPUTS_STATUS: ${{ steps.build_inputs.outcome }}
          HANDOFF_STATUS: ${{ steps.enforce_handoff.outcome }}
          CURRENT_SMOKE_STATUS: ${{ steps.current_smoke.outcome }}
          ENFORCE_SMOKE_STATUS: ${{ steps.enforce_smoke.outcome }}
        run: |
          python3 pipelines/alpine_smoke_evidence.py \
            --output artifacts/alpine-current-smoke-failure.json \
            --successful-manifest artifacts/alpine-current-smoke-manifest.json \
            --logical-date "${{ inputs.logical_date }}" \
            --blog-sha "$GITHUB_SHA" \
            --ski-sha "${SKI_SHA:-}" \
            --scraper-log artifacts/alpine-input-build.log \
            --build-inputs-status "$BUILD_INPUTS_STATUS" \
            --handoff-status "$HANDOFF_STATUS" \
            --smoke-status "$CURRENT_SMOKE_STATUS" \
            --smoke-gate-status "$ENFORCE_SMOKE_STATUS"

      - name: Upload smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alpine-current-smoke-${{ inputs.logical_date }}-${{ github.run_id }}
          path: |
            artifacts/alpine-current-smoke-report.json
            artifacts/alpine-current-smoke-manifest.json
            artifacts/alpine-current-smoke-failure.json
            artifacts/alpine-input-build.log
            external/ski-input/reports/replay.json
            external/ski-input/reports/actual-results.json
          if-no-files-found: warn
          retention-days: 30
