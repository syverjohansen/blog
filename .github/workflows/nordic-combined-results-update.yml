name: Nordic-combined automatic results pipeline

on:
  workflow_run:
    workflows: ["Nordic-combined automatic schedule pipeline"]
    types: [completed]
  workflow_dispatch:
    inputs:
      as_of:
        description: Results cutoff (YYYY-MM-DD); defaults to yesterday UTC
        required: false
        type: string
      ski_ref:
        description: Ski branch, tag, or commit to start from
        required: true
        default: main
        type: string

permissions:
  contents: write

concurrency:
  group: nordic-combined-automatic-results-pipeline
  cancel-in-progress: false

jobs:
  update:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Resolve ski source to an exact commit
        id: ski
        env:
          GH_TOKEN: ${{ secrets.BLOG_AUTOMATION_TOKEN }}
          SKI_REF: ${{ inputs.ski_ref || 'main' }}
        run: |
          ski_sha=$(gh api "repos/syverjohansen/ski/commits/$SKI_REF" --jq .sha)
          if ! [[ "$ski_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Unable to resolve ski ref: $SKI_REF" >&2
            exit 1
          fi
          echo "sha=$ski_sha" >> "$GITHUB_OUTPUT"

      - name: Check out Nordic-combined results runtime and accepted data
        uses: actions/checkout@v4
        with:
          repository: syverjohansen/ski
          ref: ${{ steps.ski.outputs.sha }}
          token: ${{ secrets.BLOG_AUTOMATION_TOKEN }}
          path: external/ski
          fetch-depth: 1
          persist-credentials: true
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /elo/python/nordic-combined/polars/

      - uses: astral-sh/setup-uv@v6

      - name: Resolve run parameters
        id: parameters
        env:
          REQUESTED_AS_OF: ${{ inputs.as_of || '' }}
        run: |
          as_of="${REQUESTED_AS_OF:-$(date -u -d 'yesterday' +%F)}"
          if ! [[ "$as_of" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
            echo "Invalid as_of date: $as_of" >&2
            exit 1
          fi
          echo "as_of=$as_of" >> "$GITHUB_OUTPUT"
          echo "results_root=$RUNNER_TEMP/nordic-combined-results-update" >> "$GITHUB_OUTPUT"

      - name: Audit completed results
        id: gap
        working-directory: external/ski/elo/python/nordic-combined/polars
        env:
          AS_OF: ${{ steps.parameters.outputs.as_of }}
          RESULTS_ROOT: ${{ steps.parameters.outputs.results_root }}
        run: |
          mkdir -p "$RESULTS_ROOT"
          python3 nordic_combined_results_gap.py \
            --schedule excel365/races.csv \
            --individual-history relay/excel365/men_chrono.csv \
            --individual-history relay/excel365/ladies_chrono.csv \
            --team-history relay/excel365/men_team_chrono.csv \
            --team-history relay/excel365/mixed_team_chrono.csv \
            --team-sprint-history relay/excel365/men_team_sprint_chrono.csv \
            --team-sprint-history relay/excel365/team_sprint_chrono.csv \
            --as-of "$AS_OF" \
            --output "$RESULTS_ROOT/gap-report.json"
          readarray -t values < <(python3 - "$RESULTS_ROOT/gap-report.json" <<'PY'
          import json, sys
          report = json.load(open(sys.argv[1], encoding="utf-8"))
          seasons = {int(row["season"]) for row in report["missing_races"]}
          if len(seasons) > 1:
              raise SystemExit(f"gaps span multiple seasons: {sorted(seasons)}")
          print(report["missing_race_count"])
          print(next(iter(seasons), ""))
          PY
          )
          echo "count=${values[0]}" >> "$GITHUB_OUTPUT"
          echo "season=${values[1]}" >> "$GITHUB_OUTPUT"
          cat "$RESULTS_ROOT/gap-report.json" >> "$GITHUB_STEP_SUMMARY"

      - name: Acquire missing FIS results
        if: steps.gap.outputs.count != '0'
        working-directory: external/ski/elo/python/nordic-combined/polars
        env:
          AS_OF: ${{ steps.parameters.outputs.as_of }}
          RESULTS_ROOT: ${{ steps.parameters.outputs.results_root }}
        run: >-
          uv run --isolated --python 3.12 --with requests --with beautifulsoup4
          python nordic_combined_results_acquire.py
          --schedule excel365/races.csv
          --individual-history relay/excel365/men_chrono.csv
          --individual-history relay/excel365/ladies_chrono.csv
          --team-history relay/excel365/men_team_chrono.csv
          --team-history relay/excel365/mixed_team_chrono.csv
          --team-sprint-history relay/excel365/men_team_sprint_chrono.csv
          --team-sprint-history relay/excel365/team_sprint_chrono.csv
          --as-of "$AS_OF"
          --output-dir "$RESULTS_ROOT/acquisition"
          --allow-network
          --fail-on-unresolved

      - name: Enforce supported replay boundary
        if: steps.gap.outputs.count != '0'
        working-directory: external/ski/elo/python/nordic-combined/polars
        env:
          RESULTS_ROOT: ${{ steps.parameters.outputs.results_root }}
        run: |
          python3 - "$RESULTS_ROOT/acquisition/results.csv" <<'PY'
          import csv, sys
          rows = list(csv.DictReader(open(sys.argv[1], encoding="utf-8-sig")))
          events = {(r["date"], r["sex"], r["season"], r["race"], r["event_kind"]) for r in rows}
          if len(events) != 1:
              raise SystemExit(f"hosted replay requires exactly one event; found {sorted(events)}")
          event = next(iter(events))
          if (event[1], event[4]) != ("Mixed", "team_sprint"):
              raise SystemExit(
                  "unsupported Nordic-combined hosted replay event; evidence retained: "
                  f"sex={event[1]} kind={event[4]}"
              )
          PY

      - name: Resolve canonical athlete identities
        if: steps.gap.outputs.count != '0'
        working-directory: external/ski/elo/python/nordic-combined/polars
        env:
          RESULTS_ROOT: ${{ steps.parameters.outputs.results_root }}
        run: |
          python3 nordic_combined_results_identity.py \
            --results "$RESULTS_ROOT/acquisition/results.csv" \
            --men-history relay/excel365/men_chrono.csv \
            --ladies-history relay/excel365/ladies_chrono.csv \
            --aliases nordic_combined_results_identity_aliases.csv \
            --output-dir "$RESULTS_ROOT/identity"

      - name: Build deterministic replay
        if: steps.gap.outputs.count != '0'
        working-directory: external/ski/elo/python/nordic-combined/polars
        env:
          RESULTS_ROOT: ${{ steps.parameters.outputs.results_root }}
          SEASON: ${{ steps.gap.outputs.season }}
        run: |
          python3 nordic_combined_results_replay.py \
            --mapped-results "$RESULTS_ROOT/identity/mapped_results.csv" \
            --men-history relay/excel365/men_chrono.csv \
            --ladies-history relay/excel365/ladies_chrono.csv \
            --team-sprint-history relay/excel365/team_sprint_chrono.csv \
            --season "$SEASON" \
            --output-dir "$RESULTS_ROOT/replay"

      - name: Build guarded promotion candidate
        if: steps.gap.outputs.count != '0'
        working-directory: external/ski/elo/python/nordic-combined/polars
        env:
          RESULTS_ROOT: ${{ steps.parameters.outputs.results_root }}
          SEASON: ${{ steps.gap.outputs.season }}
        run: |
          report="$RESULTS_ROOT/replay/replay_report.json"
          report_sha=$(sha256sum "$report" | cut -d ' ' -f 1)
          python3 nordic_combined_results_promote.py \
            --replay-report "$report" \
            --expected-report-sha256 "$report_sha" \
            --mapped-results "$RESULTS_ROOT/identity/mapped_results.csv" \
            --men-history relay/excel365/men_chrono.csv \
            --ladies-history relay/excel365/ladies_chrono.csv \
            --team-sprint-history relay/excel365/team_sprint_chrono.csv \
            --expected-season "$SEASON" \
            --output-dir "$RESULTS_ROOT/promotion"

      - name: Apply atomic results candidate
        if: steps.gap.outputs.count != '0'
        working-directory: external/ski/elo/python/nordic-combined/polars
        env:
          AS_OF: ${{ steps.parameters.outputs.as_of }}
          RESULTS_ROOT: ${{ steps.parameters.outputs.results_root }}
          SEASON: ${{ steps.gap.outputs.season }}
        run: |
          report="$RESULTS_ROOT/promotion/report.json"
          report_sha=$(sha256sum "$report" | cut -d ' ' -f 1)
          receipt="results_promotion_receipts/$SEASON-$AS_OF-results.json"
          python3 nordic_combined_results_apply.py \
            --promotion-report "$report" \
            --expected-report-sha256 "$report_sha" \
            --accepted-dir relay/excel365 \
            --approve-season "$SEASON" \
            --backup-root "$RESULTS_ROOT/backups" \
            --receipt "$receipt"
          find relay/excel365/.results-promotion.lock -depth -delete
          echo "receipt=$receipt" >> "$GITHUB_OUTPUT"

      - name: Validate and publish accepted Nordic-combined results
        if: steps.gap.outputs.count != '0'
        env:
          SEASON: ${{ steps.gap.outputs.season }}
          AS_OF: ${{ steps.parameters.outputs.as_of }}
        run: |
          root="external/ski/elo/python/nordic-combined/polars"
          uv run --isolated --python 3.12 \
            --with pytest --with beautifulsoup4 --with requests --with pandas --with fuzzywuzzy \
            pytest -q "$root"/test_nordic_combined_results_*.py
          git -C external/ski config user.name "github-actions[bot]"
          git -C external/ski config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C external/ski add \
            elo/python/nordic-combined/polars/relay/excel365/men_chrono.csv \
            elo/python/nordic-combined/polars/relay/excel365/ladies_chrono.csv \
            elo/python/nordic-combined/polars/relay/excel365/team_sprint_chrono.csv \
            "elo/python/nordic-combined/polars/results_promotion_receipts/$SEASON-$AS_OF-results.json"
          if ! git -C external/ski diff --cached --quiet; then
            git -C external/ski commit -m "Update Nordic-combined results for $SEASON"
            git -C external/ski pull --rebase origin main
            git -C external/ski push origin HEAD:main
          fi

      - name: Upload results evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nordic-combined-results-${{ steps.parameters.outputs.as_of }}-${{ github.run_id }}
          path: ${{ steps.parameters.outputs.results_root }}/
          if-no-files-found: warn
          retention-days: 30
