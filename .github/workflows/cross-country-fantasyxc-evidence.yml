name: Cross-country FantasyXC roster evidence

on:
  workflow_run:
    workflows: ["Cross-country automatic daily pipeline"]
    types: [completed]
  workflow_dispatch:
    inputs:
      logical_date:
        description: Optional weekend group date (YYYY-MM-DD)
        required: false
        type: string
      as_of:
        description: Evidence cutoff (YYYY-MM-DD); defaults to today UTC
        required: false
        type: string
      ski_ref:
        description: Ski branch, tag, or commit to resolve and record
        required: true
        default: main
        type: string
      continue_prediction_chain:
        description: Dispatch individual predictions after evidence is saved
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  actions: write

concurrency:
  group: cross-country-fantasyxc-roster-evidence
  cancel-in-progress: false

jobs:
  evidence:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out notification runtime
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Resolve ski source to an exact commit
        id: ski
        env:
          GH_TOKEN: ${{ github.token }}
          SKI_REF: ${{ inputs.ski_ref || 'main' }}
        run: |
          ski_sha=$(gh api "repos/syverjohansen/ski/commits/$SKI_REF" --jq .sha)
          if [[ ! "$ski_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Unable to resolve ski ref: $SKI_REF" >&2
            exit 1
          fi
          echo "sha=$ski_sha" >> "$GITHUB_OUTPUT"

      - name: Check out bounded ski evidence runtime
        uses: actions/checkout@v4
        with:
          repository: syverjohansen/ski
          ref: ${{ steps.ski.outputs.sha }}
          path: external/ski
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /elo/python/ski/polars/cross_country_announced_rosters.py
            /elo/python/ski/polars/cross_country_fantasyxc_feed.py
            /elo/python/ski/polars/cross_country_fantasyxc_resolve.py
            /elo/python/ski/polars/cross_country_fantasyxc_review.py
            /elo/python/ski/polars/cross_country_results_identity.py
            /elo/python/ski/polars/cross_country_weekend_inputs.py
            /elo/python/ski/polars/schedule_contract.py
            /elo/python/ski/polars/excel365/weekends.csv
            /elo/python/ski/polars/excel365/men_chrono.csv
            /elo/python/ski/polars/excel365/ladies_chrono.csv
            /elo/python/ski/polars/excel365/all_men_scrape.csv
            /elo/python/ski/polars/excel365/all_ladies_scrape.csv

      - name: Resolve bounded evidence window
        id: parameters
        working-directory: external/ski/elo/python/ski/polars
        env:
          AS_OF_INPUT: ${{ inputs.as_of || '' }}
          LOGICAL_DATE_INPUT: ${{ inputs.logical_date || '' }}
          SKI_SHA: ${{ steps.ski.outputs.sha }}
        run: |
          as_of="${AS_OF_INPUT:-$(date -u +%F)}"
          root="$RUNNER_TEMP/cross-country-fantasyxc-evidence"
          mkdir -p "$root"
          python3 - "$as_of" "$LOGICAL_DATE_INPUT" "$GITHUB_OUTPUT" <<'PY'
          import csv
          import sys
          from collections import defaultdict
          from datetime import date, datetime, timedelta
          from pathlib import Path

          as_of = date.fromisoformat(sys.argv[1])
          requested = date.fromisoformat(sys.argv[2]) if sys.argv[2] else None
          groups = defaultdict(list)
          with Path("excel365/weekends.csv").open(newline="", encoding="utf-8-sig") as handle:
              for row in csv.DictReader(handle):
                  if row["Distance"] in {"Rel", "Ts"} or row["Stage"] == "1":
                      continue
                  group_date = datetime.strptime(row["Date"], "%m/%d/%Y").date()
                  race_date = datetime.strptime(row["Race_Date"], "%m/%d/%Y").date()
                  groups[group_date].append(race_date)
          if requested is not None:
              if requested not in groups:
                  raise SystemExit(f"No normal individual weekend for {requested}")
              logical_date = requested
          else:
              eligible = [
                  group_date
                  for group_date, race_dates in groups.items()
                  if group_date >= as_of - timedelta(days=3)
                  and group_date <= as_of + timedelta(days=7)
                  and max(race_dates) >= as_of
              ]
              if not eligible:
                  with Path(sys.argv[3]).open("a") as output:
                      output.write("has_work=false\n")
                  raise SystemExit(0)
              logical_date = min(eligible)
          with Path(sys.argv[3]).open("a") as output:
              output.write("has_work=true\n")
              output.write(f"logical_date={logical_date.isoformat()}\n")
              output.write(f"as_of={as_of.isoformat()}\n")
          PY
          {
            echo "EVIDENCE_ROOT=$root"
            echo "SKI_SHA=$SKI_SHA"
          } >> "$GITHUB_ENV"

      - name: Explain no-work date
        if: steps.parameters.outputs.has_work != 'true'
        run: echo "No normal individual cross-country weekend is inside the evidence window."

      - name: Acquire bounded FantasyXC evidence
        if: steps.parameters.outputs.has_work == 'true'
        working-directory: external/ski/elo/python/ski/polars
        run: |
          python3 cross_country_fantasyxc_feed.py \
            --logical-date "${{ steps.parameters.outputs.logical_date }}" \
            --as-of "${{ steps.parameters.outputs.as_of }}" \
            --lookback-days 14 \
            --output-dir "$EVIDENCE_ROOT/feed" \
            --report "$EVIDENCE_ROOT/feed-report.json" \
            --allow-network

      - name: Resolve exact roster candidates
        if: steps.parameters.outputs.has_work == 'true'
        working-directory: external/ski/elo/python/ski/polars
        run: |
          python3 cross_country_fantasyxc_resolve.py \
            --feed-items "$EVIDENCE_ROOT/feed/fantasyxc-feed-items.json" \
            --men-chrono excel365/men_chrono.csv \
            --ladies-chrono excel365/ladies_chrono.csv \
            --men-identity-history excel365/all_men_scrape.csv \
            --ladies-identity-history excel365/all_ladies_scrape.csv \
            --schedule excel365/weekends.csv \
            --logical-date "${{ steps.parameters.outputs.logical_date }}" \
            --output "$EVIDENCE_ROOT/roster-candidates.json" \
            --report "$EVIDENCE_ROOT/resolution-report.json"

      - name: Generate checksum-bound review checklist
        if: steps.parameters.outputs.has_work == 'true'
        working-directory: external/ski/elo/python/ski/polars
        run: |
          python3 cross_country_fantasyxc_review.py template \
            --candidates "$EVIDENCE_ROOT/roster-candidates.json" \
            --logical-date "${{ steps.parameters.outputs.logical_date }}" \
            --output "$EVIDENCE_ROOT/roster-review.json"

      - name: Apply guarded automatic roster policy
        if: steps.parameters.outputs.has_work == 'true'
        working-directory: external/ski/elo/python/ski/polars
        run: |
          python3 cross_country_fantasyxc_review.py auto-promote \
            --candidates "$EVIDENCE_ROOT/roster-candidates.json" \
            --men-chrono excel365/men_chrono.csv \
            --ladies-chrono excel365/ladies_chrono.csv \
            --men-identity-history excel365/all_men_scrape.csv \
            --ladies-identity-history excel365/all_ladies_scrape.csv \
            --logical-date "${{ steps.parameters.outputs.logical_date }}" \
            --output "$EVIDENCE_ROOT/automated-announced-rosters.json"

      - name: Render country and event roster digest
        if: steps.parameters.outputs.has_work == 'true'
        id: digest
        env:
          LOGICAL_DATE: ${{ steps.parameters.outputs.logical_date }}
        run: |
          python3 .github/scripts/fantasyxc_roster_digest.py render \
            --roster "$EVIDENCE_ROOT/automated-announced-rosters.json" \
            --schedule external/ski/elo/python/ski/polars/excel365/weekends.csv \
            --logical-date "$LOGICAL_DATE" \
            --text-output "$EVIDENCE_ROOT/roster-email.txt" \
            --html-output "$EVIDENCE_ROOT/roster-email.html" \
            --metadata-output "$EVIDENCE_ROOT/roster-email-metadata.json"
          digest=$(python3 -c \
            'import json,sys; print(json.load(open(sys.argv[1]))["digest_sha256"])' \
            "$EVIDENCE_ROOT/roster-email-metadata.json")
          echo "sha256=$digest" >> "$GITHUB_OUTPUT"

      - name: Restore sent-digest marker
        if: steps.parameters.outputs.has_work == 'true'
        id: sent_digest
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/fantasyxc-email-state
          key: fantasyxc-email-v1-${{ steps.parameters.outputs.logical_date }}-${{ steps.digest.outputs.sha256 }}

      - name: Email changed roster digest
        id: roster_email
        if: >-
          steps.parameters.outputs.has_work == 'true' &&
          steps.sent_digest.outputs.cache-hit != 'true'
        continue-on-error: true
        env:
          FANTASYXC_EMAIL_ADDRESS: ${{ vars.FANTASYXC_NOTIFICATION_EMAIL || 'syverjohansen@gmail.com' }}
          FANTASYXC_SMTP_PASSWORD: ${{ secrets.FANTASYXC_EMAIL_APP_PASSWORD }}
        run: |
          python3 .github/scripts/fantasyxc_roster_digest.py send \
            --metadata "$EVIDENCE_ROOT/roster-email-metadata.json" \
            --text "$EVIDENCE_ROOT/roster-email.txt" \
            --html "$EVIDENCE_ROOT/roster-email.html" \
            --sender "$FANTASYXC_EMAIL_ADDRESS" \
            --recipient "$FANTASYXC_EMAIL_ADDRESS"
          mkdir -p "$RUNNER_TEMP/fantasyxc-email-state"
          cp "$EVIDENCE_ROOT/roster-email-metadata.json" \
            "$RUNNER_TEMP/fantasyxc-email-state/sent.json"

      - name: Save sent-digest marker
        if: >-
          steps.parameters.outputs.has_work == 'true' &&
          steps.sent_digest.outputs.cache-hit != 'true' &&
          steps.roster_email.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/fantasyxc-email-state
          key: fantasyxc-email-v1-${{ steps.parameters.outputs.logical_date }}-${{ steps.digest.outputs.sha256 }}

      - name: Stage automatic roster handoff
        if: steps.parameters.outputs.has_work == 'true'
        run: |
          mkdir -p .fantasyxc-handoff
          cp "$EVIDENCE_ROOT/automated-announced-rosters.json" \
            .fantasyxc-handoff/automated-announced-rosters.json

      - name: Save automatic roster handoff
        if: steps.parameters.outputs.has_work == 'true'
        uses: actions/cache/save@v4
        with:
          path: .fantasyxc-handoff/automated-announced-rosters.json
          key: fantasyxc-roster-v1-${{ steps.parameters.outputs.logical_date }}-${{ steps.parameters.outputs.as_of }}-${{ steps.digest.outputs.sha256 }}

      - name: Record immutable run metadata
        if: steps.parameters.outputs.has_work == 'true'
        env:
          AS_OF: ${{ steps.parameters.outputs.as_of }}
          LOGICAL_DATE: ${{ steps.parameters.outputs.logical_date }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["EVIDENCE_ROOT"])
          document = {
              "schema_version": "nordicnumbers.cross-country-fantasyxc-hosted-evidence/v1",
              "logical_date": os.environ["LOGICAL_DATE"],
              "as_of": os.environ["AS_OF"],
              "blog_commit": os.environ["GITHUB_SHA"],
              "ski_commit": os.environ["SKI_SHA"],
              "github_run_id": os.environ["GITHUB_RUN_ID"],
              "publication": {"status": "disabled"},
          }
          (root / "run-metadata.json").write_text(
              json.dumps(document, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          candidates = json.loads((root / "roster-candidates.json").read_text())
          automated = json.loads(
              (root / "automated-announced-rosters.json").read_text()
          )
          summary = os.environ["GITHUB_STEP_SUMMARY"]
          with Path(summary).open("a", encoding="utf-8") as handle:
              handle.write("## FantasyXC roster evidence\n\n")
              handle.write(f"- Weekend: `{document['logical_date']}`\n")
              handle.write(f"- Evidence cutoff: `{document['as_of']}`\n")
              handle.write(f"- Candidates: {len(candidates['candidates'])}\n")
              handle.write(f"- Review exceptions: {len(candidates['review_exceptions'])}\n")
              handle.write(f"- Automatically applied: {len(automated['entries'])}\n")
              handle.write(f"- Using fallback: {len(automated['unresolved'])}\n")
              handle.write("- Email: sent only when the roster digest changes\n")
              handle.write("- Publication: **disabled**\n")
          PY

      - name: Retain roster evidence and review checklist
        if: always() && steps.parameters.outputs.has_work == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: cross-country-fantasyxc-${{ steps.parameters.outputs.logical_date }}-${{ steps.parameters.outputs.as_of }}
          path: ${{ env.EVIDENCE_ROOT }}/
          if-no-files-found: error
          retention-days: 90

      - name: Continue automatic prediction chain
        if: >-
          success() &&
          (github.event_name == 'workflow_run' ||
          inputs.continue_prediction_chain == true)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run cross-country-individual-predictions.yml \
            --ref main \
            -f ski_ref="$SKI_SHA"
