name: Combined Race Picks publication

on:
  workflow_dispatch:
    inputs:
      logical_date:
        description: Race date to aggregate (YYYY-MM-DD)
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: combined-race-picks-${{ inputs.logical_date }}
  cancel-in-progress: false

jobs:
  aggregate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out latest validated fragments
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Validate logical date
        env:
          LOGICAL_DATE: ${{ inputs.logical_date }}
        run: |
          if ! [[ "$LOGICAL_DATE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
            echo "Invalid logical date: $LOGICAL_DATE" >&2
            exit 1
          fi

      - name: Resolve schedules to an exact ski commit
        id: ski
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ski_sha=$(gh api "repos/syverjohansen/ski/commits/main" --jq .sha)
          [[ "$ski_sha" =~ ^[0-9a-f]{40}$ ]]
          echo "sha=$ski_sha" >> "$GITHUB_OUTPUT"

      - name: Check out bounded sport schedules
        uses: actions/checkout@v4
        with:
          repository: syverjohansen/ski
          ref: ${{ steps.ski.outputs.sha }}
          path: external/ski
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /elo/python/alpine/polars/excel365/races.csv
            /elo/python/ski/polars/excel365/races.csv
            /elo/python/skijump/polars/excel365/races.csv
            /elo/python/nordic-combined/polars/excel365/races.csv
            /elo/python/biathlon/polars/excel365/races.csv

      - name: Build one combined Race Picks post
        id: build
        env:
          LOGICAL_DATE: ${{ inputs.logical_date }}
        run: |
          python3 -m pipelines.race_picks_aggregation build \
            --logical-date "$LOGICAL_DATE" \
            --ski-root external/ski \
            --report "$RUNNER_TEMP/combined-race-picks-build.json"
          status=$(REPORT="$RUNNER_TEMP/combined-race-picks-build.json" \
            python3 -c 'import json,os; print(json.load(open(os.environ["REPORT"]))["status"])')
          if [ "$status" = "waiting" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Race Picks are waiting for the remaining scheduled sports." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Hugo
        if: steps.build.outputs.ready == 'true'
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.134.1"
          extended: true

      - name: Render exact combined page
        if: steps.build.outputs.ready == 'true'
        env:
          LOGICAL_DATE: ${{ inputs.logical_date }}
        run: |
          python3 -m pipelines.race_picks_aggregation render \
            --logical-date "$LOGICAL_DATE" \
            --destination "$RUNNER_TEMP/combined-race-picks-site" \
            --report "$RUNNER_TEMP/combined-race-picks-render.json"

      - name: Publish only the combined post
        if: steps.build.outputs.ready == 'true'
        env:
          LOGICAL_DATE: ${{ inputs.logical_date }}
        run: |
          date_key="${LOGICAL_DATE//-/}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- content/post/race-picks
          if git diff --cached --quiet; then
            echo "Combined Race Picks are already current."
            exit 0
          fi
          git commit -m "Publish combined Race Picks for $LOGICAL_DATE"
          for attempt in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 5))
          done
          exit 1

      - name: Retain aggregation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: combined-race-picks-${{ inputs.logical_date }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/combined-race-picks-build.json
            ${{ runner.temp }}/combined-race-picks-render.json
          if-no-files-found: warn
          retention-days: 30
