name: Nordic Combined prediction shadow

on:
  schedule:
    - cron: "17 5,11,17,23 * 1-3,11-12 *"
  workflow_dispatch:
    inputs:
      logical_date:
        description: Race date (YYYY-MM-DD); defaults to today UTC
        required: false
        type: string
      n_simulations:
        description: Deterministic Monte Carlo iteration count
        required: true
        default: 250
        type: number
      random_seed:
        description: Deterministic simulation seed
        required: true
        default: 20260210
        type: number
      ski_ref:
        description: Accepted ski branch, tag, or commit to read
        required: true
        default: main
        type: string

permissions:
  contents: read

concurrency:
  group: nordic-combined-prediction-shadow
  cancel-in-progress: false

jobs:
  shadow:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out bounded blog runtime
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /pipelines/__init__.py
            /pipelines/requirements-integration.txt
            /pipelines/requirements-snapshot.txt
            /pipelines/nordic_combined_prediction_contract.py
            /pipelines/nordic_combined_shadow_retry.py
            /pipelines/nordic_combined_prediction_shadow.py
            /content/post/nordic-combined/drafts/race-picks-simulation.R
            /content/post/shared/logging-utils.R
            /static/python/excel_to_hugo_multiple_sheets.py

      - name: Resolve ski source to an exact commit
        id: ski
        env:
          GH_TOKEN: ${{ github.token }}
          SKI_REF: ${{ inputs.ski_ref || 'main' }}
        run: |
          ski_sha=$(gh api "repos/syverjohansen/ski/commits/$SKI_REF" --jq .sha)
          if ! [[ "$ski_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Unable to resolve ski ref: $SKI_REF" >&2
            exit 1
          fi
          echo "sha=$ski_sha" >> "$GITHUB_OUTPUT"

      - name: Check out only declared Nordic Combined inputs
        uses: actions/checkout@v4
        with:
          repository: syverjohansen/ski
          ref: ${{ steps.ski.outputs.sha }}
          path: external/ski
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /elo/python/nordic-combined/polars/excel365/races.csv
            /elo/python/nordic-combined/polars/excel365/men_chrono_elevation.csv
            /elo/python/nordic-combined/polars/excel365/ladies_chrono_elevation.csv
            /elo/python/nordic-combined/polars/relay/excel365/men_team_chrono.csv
            /elo/python/nordic-combined/polars/relay/excel365/ladies_team_chrono.csv
            /elo/python/nordic-combined/polars/relay/excel365/mixed_team_chrono.csv
            /elo/python/nordic-combined/polars/relay/excel365/team_sprint_chrono.csv
            /elo/python/nordic-combined/polars/nordic_combined_results_gap.py
            /elo/python/nordic-combined/polars/nordic_combined_results_identity.py
            /elo/python/nordic-combined/polars/nordic_combined_results_identity_aliases.csv
            /elo/python/nordic-combined/polars/nordic_combined_startlist_acquire.py
            /elo/python/nordic-combined/polars/nordic_combined_startlist_normalize.py

      - name: Prepare immutable shadow parameters
        env:
          LOGICAL_DATE_INPUT: ${{ inputs.logical_date || '' }}
          N_SIMULATIONS_INPUT: ${{ inputs.n_simulations || 250 }}
          RANDOM_SEED_INPUT: ${{ inputs.random_seed || 20260210 }}
          SKI_SHA: ${{ steps.ski.outputs.sha }}
        run: |
          logical_date=$(python3 -m pipelines.nordic_combined_shadow_retry resolve-date \
            --schedule external/ski/elo/python/nordic-combined/polars/excel365/races.csv \
            --requested "$LOGICAL_DATE_INPUT" \
            --event-name "$GITHUB_EVENT_NAME")
          python3 - "$logical_date" "$N_SIMULATIONS_INPUT" "$RANDOM_SEED_INPUT" <<'PY'
          from datetime import date
          import sys
          date.fromisoformat(sys.argv[1])
          if int(sys.argv[2]) < 1:
              raise SystemExit("n_simulations must be positive")
          int(sys.argv[3])
          PY
          blog_sha=$(git rev-parse HEAD)
          run_id="github-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          shadow_root="$RUNNER_TEMP/nordic-combined-prediction-shadow"
          {
            echo "LOGICAL_DATE=$logical_date"
            echo "N_SIMULATIONS=$N_SIMULATIONS_INPUT"
            echo "RANDOM_SEED=$RANDOM_SEED_INPUT"
            echo "BLOG_SHA=$blog_sha"
            echo "SKI_SHA=$SKI_SHA"
            echo "RUN_ID=$run_id"
            echo "SHADOW_ROOT=$shadow_root"
            echo "REPORT_PATH=$shadow_root/runs/$run_id/reports/shadow-report.json"
            echo "STARTLIST_ACQUISITION_ROOT=$shadow_root/acquired-startlists"
            echo "STARTLIST_NORMALIZATION_ROOT=$shadow_root/normalized-startlists"
            echo "STARTLIST_CANDIDATE_ROOT=$shadow_root/normalized-startlists/candidates"
            echo "STARTLIST_NORMALIZATION_REPORT=$shadow_root/normalized-startlists/report.json"
            echo "STARTLIST_ALIAS_FILE=$GITHUB_WORKSPACE/external/ski/elo/python/nordic-combined/polars/nordic_combined_results_identity_aliases.csv"
          } >> "$GITHUB_ENV"

      - name: Set up Python validation runtime
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipelines/requirements-integration.txt

      - name: Install workbook validation dependencies
        run: python3 -m pip install -r pipelines/requirements-integration.txt

      - name: Plan exact-date prediction work
        id: plan
        run: |
          plan="$SHADOW_ROOT/plan-preflight.json"
          mkdir -p "$SHADOW_ROOT"
          python3 -m pipelines.nordic_combined_prediction_contract \
            --schedule external/ski/elo/python/nordic-combined/polars/excel365/races.csv \
            --logical-date "$LOGICAL_DATE" \
            --output "$plan"
          status=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["status"])' "$plan")
          if [[ "$status" == "ready_for_shadow_implementation" ]]; then
            echo "has_work=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_work=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Acquire exact-date official FIS startlists
        id: acquire_startlists
        if: steps.plan.outputs.has_work == 'true'
        continue-on-error: true
        run: |
          python3 external/ski/elo/python/nordic-combined/polars/nordic_combined_startlist_acquire.py \
            --schedule external/ski/elo/python/nordic-combined/polars/excel365/races.csv \
            --logical-date "$LOGICAL_DATE" \
            --output-dir "$STARTLIST_ACQUISITION_ROOT" \
            --allow-network \
            --fail-if-waiting

      - name: Classify official-list acquisition
        id: acquisition
        if: always() && steps.plan.outputs.has_work == 'true'
        run: |
          python3 -m pipelines.nordic_combined_shadow_retry classify \
            --report "$STARTLIST_ACQUISITION_ROOT/report.json" \
            --step-outcome "${{ steps.acquire_startlists.outcome }}" \
            --github-output "$GITHUB_OUTPUT"

      - name: Normalize official startlists to canonical identities
        id: normalize_startlists
        if: steps.acquisition.outputs.status == 'ready'
        continue-on-error: true
        run: |
          python3 external/ski/elo/python/nordic-combined/polars/nordic_combined_startlist_normalize.py \
            --acquired-startlists "$STARTLIST_ACQUISITION_ROOT/startlists.csv" \
            --acquisition-report "$STARTLIST_ACQUISITION_ROOT/report.json" \
            --men-history external/ski/elo/python/nordic-combined/polars/excel365/men_chrono_elevation.csv \
            --ladies-history external/ski/elo/python/nordic-combined/polars/excel365/ladies_chrono_elevation.csv \
            --aliases "$STARTLIST_ALIAS_FILE" \
            --logical-date "$LOGICAL_DATE" \
            --output-dir "$STARTLIST_NORMALIZATION_ROOT" \
            --fail-on-unresolved

      - name: Set up R
        if: steps.normalize_startlists.outcome == 'success'
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install R simulation dependencies
        if: steps.normalize_startlists.outcome == 'success'
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::dplyr
            any::tidyr
            any::openxlsx
            any::mgcv
            any::leaps
            any::logger
            any::lubridate

      - name: Retain waiting official-list evidence
        if: steps.acquisition.outputs.status == 'waiting'
        run: |
          python3 -m pipelines.nordic_combined_shadow_retry write-waiting \
            --report "$STARTLIST_ACQUISITION_ROOT/report.json" \
            --output "$REPORT_PATH" \
            --run-id "$RUN_ID" \
            --logical-date "$LOGICAL_DATE" \
            --blog-commit "$BLOG_SHA" \
            --ski-commit "$SKI_SHA"

      - name: Run publication-disabled prediction shadow
        id: run_shadow
        if: >-
          always() &&
          (steps.plan.outputs.has_work != 'true' ||
          steps.normalize_startlists.outcome == 'success')
        continue-on-error: true
        run: |
          startlist_args=()
          if [[ "${{ steps.plan.outputs.has_work }}" == "true" ]]; then
            startlist_args=(
              --startlist-root "$STARTLIST_CANDIDATE_ROOT"
              --startlist-report "$STARTLIST_NORMALIZATION_REPORT"
            )
          fi
          python3 -m pipelines.nordic_combined_prediction_shadow \
            --blog-root "$GITHUB_WORKSPACE" \
            --ski-root "$GITHUB_WORKSPACE/external/ski" \
            --output-root "$SHADOW_ROOT" \
            --logical-date "$LOGICAL_DATE" \
            --run-id "$RUN_ID" \
            --n-simulations "$N_SIMULATIONS" \
            --random-seed "$RANDOM_SEED" \
            --blog-commit "$BLOG_SHA" \
            --ski-commit "$SKI_SHA" \
            "${startlist_args[@]}"

      - name: Retain pre-run failure evidence
        if: always()
        env:
          RUNNER_OUTCOME: ${{ steps.run_shadow.outcome }}
          ACQUISITION_OUTCOME: ${{ steps.acquire_startlists.outcome }}
          NORMALIZATION_OUTCOME: ${{ steps.normalize_startlists.outcome }}
        run: |
          if [[ -f "$REPORT_PATH" ]]; then
            exit 0
          fi
          mkdir -p "$(dirname "$REPORT_PATH")"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          report = {
              "schema_version": "nordicnumbers.nordic-combined-prediction-shadow/v1",
              "pipeline_id": "nordic_combined_prediction_shadow",
              "run_id": os.environ["RUN_ID"],
              "logical_date": os.environ["LOGICAL_DATE"],
              "status": "failed",
              "error": "shadow runner did not produce its report",
              "upstream_outcomes": {
                  "acquisition": os.environ.get("ACQUISITION_OUTCOME", "unknown"),
                  "normalization": os.environ.get("NORMALIZATION_OUTCOME", "unknown"),
                  "runner": os.environ.get("RUNNER_OUTCOME", "unknown"),
              },
              "publication": {
                  "status": "disabled",
                  "reason": "shadow runs retain evidence and cannot create or publish posts",
              },
          }
          path = Path(os.environ["REPORT_PATH"])
          path.write_text(json.dumps(report, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          PY

      - name: Upload complete shadow evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nordic-combined-prediction-shadow-${{ env.LOGICAL_DATE }}-${{ github.run_id }}
          path: ${{ runner.temp }}/nordic-combined-prediction-shadow/
          if-no-files-found: error
          retention-days: 30

      - name: Enforce retained publication-disabled result
        if: always()
        env:
          RUNNER_OUTCOME: ${{ steps.run_shadow.outcome }}
          ACQUISITION_STATUS: ${{ steps.acquisition.outputs.status }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          report_path = Path(os.environ["REPORT_PATH"])
          if not report_path.is_file():
              raise SystemExit(f"shadow report is missing: {report_path}")
          report = json.loads(report_path.read_text(encoding="utf-8"))
          expected = {
              "reason": "shadow runs retain evidence and cannot create or publish posts",
              "status": "disabled",
          }
          if report.get("publication") != expected:
              raise SystemExit("shadow publication lock was not retained")
          if (
              report.get("status") == "skipped"
              and report.get("reason") == "official_startlist_waiting"
          ):
              if os.environ.get("ACQUISITION_STATUS") != "waiting":
                  raise SystemExit("waiting report lacks a waiting acquisition")
              raise SystemExit(0)
          if os.environ["RUNNER_OUTCOME"] != "success":
              raise SystemExit(f"shadow runner failed; evidence retained at {report_path}")
          if report.get("status") not in {"passed", "skipped"}:
              raise SystemExit(f"unexpected shadow status: {report.get('status')}")
          PY
